###################################
# Komodo Core + local Periphery
# Used only by bootstrap (Layer 0). Not deployed via ResourceSync.
###################################

services:
  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17
    labels:
      komodo.skip: true
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KOMODO_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      POSTGRES_DB: postgres

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2
    labels:
      komodo.skip: true
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - ferretdb-state:/state
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DATABASE_USERNAME}:${KOMODO_DATABASE_PASSWORD}@postgres:5432/postgres

  core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    restart: unless-stopped
    depends_on:
      - ferretdb
    ports:
      - "9120:9120"
    env_file: ./compose.env
    extra_hosts:
      - "auth.${DOMAIN}:${NAS_LAN_IP}"
    environment:
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
      # rustls: Caddy tls internal + public CAs (see bootstrap/authelia-oidc.sh).
      SSL_CERT_FILE: /etc/ssl/caddy/ca-bundle.crt
    volumes:
      # Shared with periphery so Core can trust file:/config/keys/periphery.pub
      - keys:/config/keys
      - ${COMPOSE_KOMODO_BACKUPS_PATH}:/backups
      - ${KOMODO_CORE_CONFIG_TOML}:/config/config.toml:ro
      - ${DATA_ROOT}/system/authelia/ca-bundle.crt:/etc/ssl/caddy/ca-bundle.crt:ro
    # Dual-homed: default is internet (GitHub); edge is gitea:3000 / Caddy mesh.
    # Engine 28+: gw_priority (higher = default route). Older engines: last
    # network attached becomes the gateway, so compose `priority` is inverted
    # (edge connected first, default last). Do not rename `default` (that
    # deletes `{project}_default` and leaves postgres/ferretdb stuck).
    # Recreate via this file — do not `docker network connect` on a running Core.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    networks:
      default:
        priority: 0
        gw_priority: 1
      edge:
        priority: 100
        gw_priority: 0

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    restart: unless-stopped
    depends_on:
      - core
    env_file: ./compose.env
    volumes:
      - keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - ${PERIPHERY_ROOT_DIRECTORY}:${PERIPHERY_ROOT_DIRECTORY}

volumes:
  postgres-data:
  ferretdb-state:
  keys:

networks:
  edge:
    external: true
    name: edge
