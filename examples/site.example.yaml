# Copy to ./site.yaml (gitignored) and fill in. Validate against schema/site.schema.json.
# Comment-only engines (traefik, authentik, nextcloud, ceph, …) are vocabulary, not implemented.

site:
  data:
    roots:
      appdata: /appdata
      groups: /groups
      users: /users
    access:
      filesystem: smb
      web: opencloud
  networking:
    dns: pi-hole
    ingress:
      engine: caddy
      generate-upstream: true
    tunnel:
      engine: none
      endpoint: vpn.example.lan
  identity:
    ldap: none
    sso: authelia
    ssh: key-only
  operations:
    storage:
      engine: native
      #monitor: scrutiny
    workload:
      engine: podman
      #monitor: uptime-kuma
  env:
    domain: example.lan
    timezone: UTC
    locale: en_US.UTF-8
  users:
    - name: alice
      roles: [sysuser, appadmin]
      displayname: Alice
      email: alice@example.lan
      groups: [all]
    - name: bob
      roles: [sysuser, appuser]
      displayname: Bob
      email: bob@example.lan
      groups: [all]
  hosts:
    - name: storage
      admin-gui:
        enabled: true
        primary: sys
        aliases: [cockpit]
      ip: 10.0.0.10
      os:
        name: debian
        version: "13"
      resources:
        disks:
          - id: data
            name: ST4000NE001-2EN11C
            size: 4T
            uuid: 00000000-0000-0000-0000-000000000001
            # import:                         # from: is relative to this disk's mount
            #   - type: users-root            # merge old tree into site.data.roots.users
            #     from: /users
            #   - type: user-home
            #     from: /users/alice
            #   - type: group-home            # as: relocates under groups-root
            #     from: /shared
            #     as: /all
            #   - type: appdata-home
            #     from: /system/caddy
        # usb:
        #   - id: "0764:0501"
        #     name: Cyber Power System Inc.
        #     type: ups                      # SET installs NUT; PeaNUT is a listed service
        # pwm:
        #   path: /sys/class/hwmon/hwmon0/pwm1
        #   enabled: true
        #   scale:                             # each source has one ceiling per step
        #     min: 0
        #     max: 124
        #     steps: [50, 70, 90, 110, 124]
        #     sources:
        #       cpu: [60, 68, 75, 80, 85]
        #       disks:
        #         - data: [40, 43, 46, 50, 55]
        #       gpus:
        #         - gpu0: [65, 72, 78, 84, 90]
      users:
        - name: admin
          roles: [sysadmin]
          ssh-keys: ["ssh-ed25519 AAAAEXAMPLE replace-me"]
      operations:
        storage:
          drives:
            - id: data
              roots: [appdata, groups, users]
        workload:
          user: admin
          services:
            caddy:
            authelia:
            # radicale and collabora are separate services. OpenCloud links to
            # each one only while that service is listed.
            opencloud:
            pi-hole:
              - name: pi-hole
                subdomain:
                  primary: dns
                  aliases: [pihole]
            homepage:
    - name: compute
      ip: 10.0.0.11
      os:
        name: ubuntu
        version: "24.04"
      data:
        roots:
          appdata: /var/lib/site-appdata
      resources:
        disks:
          - id: local
            name: mmc
            size: 32G
            internal: true
            roots: [appdata]
        gpu:
          - id: gpu0
            name: NVIDIA GeForce RTX 2060
            uuid: GPU-00000000-0000-0000-0000-000000000001
            resource: nvidia.com/gpu
      users:
        - name: admin
          roles: [sysadmin]
          ssh-keys: ["ssh-ed25519 AAAAEXAMPLE replace-me"]
      operations:
        workload:
          user: admin
          services:
            glances:
