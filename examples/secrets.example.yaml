# Encrypt with sops/age as secrets.sops.yaml (gitignored).
# Site secrets install on every workload host. Host secrets install only on that host.
# Podman names are <service>_<secret> (pi-hole web_password → pihole_web_password).
# ${secrets.authelia.session}, ${secrets.site.authelia.session}, and ${secrets.session}
# (inside the authelia unit) are the same site secret.
# ${secrets.host.web_password} inside the pi-hole unit is that host's web_password.
secrets:
  site:
    authelia:
      jwt: change-me
      session: change-me
      storage: change-me
      hmac: change-me
      oidc_client_secret: change-me
    opencloud:
      admin_password: change-me
    openldap:
      admin_password: change-me
    peanut:
      nut_remote_password: change-me
    immich:
      database_password: change-me
    vaultwarden:
      admin_token: change-me
    transmute:
      auth_secret: change-me
    wireguard:
      ui_password: change-me
    restic:
      password: change-me
      rest_password: change-me
    openreader:
      auth_secret: change-me
    n8n:
      encryption_key: change-me
    monitoring:
      grafana_admin_password: change-me
    linkding:
      superuser_password: change-me
    caddymanager:
      jwt: change-me
    bytestash:
      jwt: change-me
    adventurelog:
      postgres_password: change-me
      admin_password: change-me
    homepage:
      jellyfin_key: change-me
      sonarr_key: change-me
      radarr_key: change-me
      prowlarr_key: change-me
      qbit_username: change-me
      qbit_password: change-me
      grafana_key: change-me
      wgeasy_password: change-me
  hosts:
    storage:
      pi-hole:
        web_password: change-me
    compute:
      pi-hole:
        web_password: change-me
