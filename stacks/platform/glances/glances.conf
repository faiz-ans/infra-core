# Catalog Glances fs filter. Homepage matches mnt_point exactly.
# Docker Desktop (periphery) bind-mounts are often overlay/9p/fuse, which
# Glances hides unless allow= is set. show= is the widget paths only.
[fs]
disable=False
allow=overlay,fuse,9p,fuse.grpcfuse,virtiofs,drvfs,fuseblk
show=/mnt/host,/mnt/data
