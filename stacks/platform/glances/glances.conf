# Loaded at /etc/glances/glances.conf (the path the image ships).
# Docker Desktop fs types are often overlay/9p/fuse; Glances hides those
# unless allow= is set. Do not set show= — that hides /etc/hosts, which is
# the physical disk bind Docker injects into every container.
[fs]
disable=False
allow=overlay,fuse,9p,fuse.grpcfuse,virtiofs,drvfs,fuseblk
alias=/etc/hosts:Disk,/mnt/data:Data
