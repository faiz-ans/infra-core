# Loaded at /etc/glances/glances.conf (the path the image ships).
# Docker Desktop bind of Windows C: is 9p/drvfs/fuse — hidden unless allow=.
[fs]
disable=False
allow=overlay,fuse,9p,fuse.grpcfuse,virtiofs,drvfs,fuseblk
alias=/mnt/windows:C,/mnt/data:Data

[sensors]
disable=False

[gpu]
disable=False
