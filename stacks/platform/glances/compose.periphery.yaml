# Glances on periphery. pid:host is the Docker Desktop VM (CPU/RAM).
# Homepage on Core scrapes HTPC_UPSTREAM:61208. Not in Caddy.
# Disk must be Windows C:, not the WSL2 VHD. Docker Desktop exposes that
# drive at /mnt/host/c inside the engine VM (9p/drvfs). Bind it at a
# stable path so Homepage can match mnt_point without a drive letter.
services:
  glances:
    image: nicolargo/glances:latest
    container_name: glances-periphery
    restart: unless-stopped
    pid: host
    environment:
      TZ: ${TZ}
      GLANCES_OPT: "-w --disable-plugin docker"
    ports:
      - "61208:61208"
    volumes:
      - ./glances.conf:/etc/glances/glances.conf:ro
      - /etc/os-release:/etc/os-release:ro
      - /mnt/host/c:/mnt/windows:ro
