# Glances on periphery. pid:host is the Docker Desktop VM (where containers run).
# Homepage on Core scrapes HTPC_UPSTREAM:61208. Not in Caddy.
# Do not bind host / — that is overlay and Glances drops it (disk widget empty).
# /var/lib/docker sits on the WSL2 data disk; df of that path is the VM disk.
services:
  glances:
    image: nicolargo/glances:latest
    container_name: glances-periphery
    restart: unless-stopped
    pid: host
    environment:
      TZ: ${TZ}
      GLANCES_OPT: "-w --disable-plugin docker -C /glances/conf/glances.conf"
    ports:
      - "61208:61208"
    volumes:
      - ./glances.conf:/glances/conf/glances.conf:ro
      - /etc/os-release:/etc/os-release:ro
      - /var/lib/docker:/mnt/host:ro
