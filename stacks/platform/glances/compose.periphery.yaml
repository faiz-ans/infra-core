# Glances on periphery. pid:host is the Docker Desktop VM (where containers run).
# Homepage on Core scrapes HTPC_UPSTREAM:61208. Not in Caddy.
# Overlay / and extra binds do not show in Glances' physical-fs list.
# Docker always bind-mounts /etc/hosts from the VM disk; that is the
# mnt_point Homepage uses (see widgets.yaml).
services:
  glances:
    image: nicolargo/glances:latest
    container_name: glances-periphery
    restart: unless-stopped
    pid: host
    environment:
      TZ: ${TZ}
      GLANCES_OPT: "-w --disable-plugin docker"
    ports:
      - "61208:61208"
    volumes:
      - ./glances.conf:/etc/glances/glances.conf:ro
      - /etc/os-release:/etc/os-release:ro
