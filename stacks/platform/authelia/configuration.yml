server:
  address: tcp://0.0.0.0:9091
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth

log:
  level: info

identity_validation:
  reset_password:
    jwt_secret: '{{ env "AUTHELIA_JWT_SECRET" }}'

authentication_backend:
  file:
    path: /config/users.yml

access_control:
  default_policy: two_factor
  rules:
    - domain: 'authelia.{{ env "DOMAIN" }}'
      policy: bypass

session:
  secret: '{{ env "AUTHELIA_SESSION_SECRET" }}'
  cookies:
    - name: authelia_session
      domain: '{{ env "DOMAIN" }}'
      authelia_url: 'https://authelia.{{ env "DOMAIN" }}'
      default_redirection_url: 'https://homepage.{{ env "DOMAIN" }}'

storage:
  encryption_key: '{{ env "AUTHELIA_STORAGE_ENCRYPTION_KEY" }}'
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt
