# Secrets come from AUTHELIA_* environment variables. Do not use
# {{ env "AUTHELIA_*_SECRET" }} — Authelia's template env() hides those names
# and would render empty keys (container restart loop).

server:
  address: tcp://0.0.0.0:9091
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth

log:
  level: info

authentication_backend:
  file:
    path: /config/users.yml

access_control:
  default_policy: two_factor
  rules:
    - domain: 'authelia.{{ env "DOMAIN" }}'
      policy: bypass

session:
  cookies:
    - name: authelia_session
      domain: '{{ env "DOMAIN" }}'
      authelia_url: 'https://authelia.{{ env "DOMAIN" }}'
      default_redirection_url: 'https://homepage.{{ env "DOMAIN" }}'

storage:
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt
