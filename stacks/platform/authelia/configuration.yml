# Authelia's template env() refuses names that start with AUTHELIA_ and
# end in SECRET/KEY. Pass the same values as JWT_SECRET / SESSION_SECRET /
# STORAGE_ENCRYPTION_KEY instead.

server:
  address: tcp://0.0.0.0:9091
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth

log:
  level: info

authentication_backend:
  file:
    path: /config/users.yml
  password_reset:
    disable: true

access_control:
  default_policy: one_factor
  rules:
    - domain: 'authelia.{{ env "DOMAIN" }}'
      policy: bypass

session:
  secret: '{{ env "SESSION_SECRET" }}'
  cookies:
    - name: authelia_session
      domain: '{{ env "DOMAIN" }}'
      authelia_url: 'https://authelia.{{ env "DOMAIN" }}'
      default_redirection_url: 'https://homepage.{{ env "DOMAIN" }}'

storage:
  encryption_key: '{{ env "STORAGE_ENCRYPTION_KEY" }}'
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt
