# OIDC needs ${DATA_ROOT}/system/authelia/oidc.pem and client_secret_digest
# (bootstrap/authelia-oidc.sh or core.sh). users.yml is faiz + diana.
services:
  authelia:
    image: authelia/authelia:4
    container_name: authelia
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      DOMAIN: ${DOMAIN}
      SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      OIDC_HMAC_SECRET: ${AUTHELIA_OIDC_HMAC_SECRET}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      X_AUTHELIA_CONFIG_FILTERS: template
    # LAN-only HTTP for HTPC OIDC discovery (Transmute). Browsers still use Caddy HTTPS.
    ports:
      - "${NAS_LAN_IP}:9091:9091"
    volumes:
      - ./configuration.yml:/config/configuration.yml:ro
      - ${DATA_ROOT}/system/authelia:/config/userdb
      - authelia-data:/data
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge

volumes:
  authelia-data:
