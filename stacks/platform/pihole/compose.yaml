# Core Pi-hole. HTPC spare is compose.periphery.yaml (local volume, HTPC_UPSTREAM:53).
services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    # 0.0.0.0:53 (not ${NAS_LAN_IP}:53): docker-proxy is up before DHCP assigns
    # the LAN address. Binding a specific IP fails at create and stays dead
    # until recreate. 127.0.0.53 (systemd-resolved) is a different socket.
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      TZ: ${TZ}
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD}
      # local= : AAAA NODATA (Firefox). Wildcard: *.DOMAIN → NAS. host-record:
      # LAN short name (SSH/SMB) = Core hostname (Komodo CORE_SERVER).
      FTLCONF_misc_dnsmasq_lines: "local=/${DOMAIN}/;address=/${DOMAIN}/${NAS_LAN_IP};host-record=${CORE_SERVER},${NAS_LAN_IP}"
    volumes:
      - ${DATA_ROOT}/system/pihole:/etc/pihole
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge
