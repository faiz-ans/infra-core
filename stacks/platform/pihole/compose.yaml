# Core Pi-hole. HTPC spare is compose.periphery.yaml (local volume, HTPC_UPSTREAM:53).
services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    # Bind DNS to the LAN IP only so systemd-resolved on 127.0.0.53 keeps :53.
    ports:
      - "${NAS_LAN_IP}:53:53/tcp"
      - "${NAS_LAN_IP}:53:53/udp"
    environment:
      TZ: ${TZ}
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD}
      # local= makes AAAA NODATA (not NXDOMAIN). Firefox follows RFC 4074 and
      # will not try A if AAAA is NXDOMAIN — Edge still does, so only Firefox
      # shows "can't find the site" for *.home.lan.
      FTLCONF_misc_dnsmasq_lines: "local=/${DOMAIN}/;address=/${DOMAIN}/${NAS_LAN_IP}"
    volumes:
      - ${DATA_ROOT}/system/pihole:/etc/pihole
    cap_add:
      - NET_ADMIN
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge
