# Core Pi-hole. HTPC spare is compose.periphery.yaml (local volume, HTPC_UPSTREAM:53).
services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    # Do not bind 0.0.0.0:53 (collides with systemd-resolved on 127.0.0.53).
    # Do not bind ${NAS_LAN_IP}:53 (fails if Docker starts before DHCP).
    # Host 127.0.0.1:15353 always exists; core-lan-bind REDIRECTs LAN :53 there.
    ports:
      - "127.0.0.1:15353:53/tcp"
      - "127.0.0.1:15353:53/udp"
    environment:
      TZ: ${TZ}
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD}
      # local= : AAAA NODATA (Firefox). Wildcard: *.DOMAIN → NAS. host-record:
      # LAN short name (SSH/SMB) = Core hostname (Komodo CORE_SERVER).
      FTLCONF_misc_dnsmasq_lines: "local=/${DOMAIN}/;address=/${DOMAIN}/${NAS_LAN_IP};host-record=${CORE_SERVER},${NAS_LAN_IP}"
    volumes:
      - ${DATA_ROOT}/system/pihole:/etc/pihole
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge
