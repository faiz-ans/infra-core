services:
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wireguard
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      WG_HOST: ${WG_HOST}
      # bcrypt. In Komodo store $ as $$ so Compose does not eat the hash.
      PASSWORD_HASH: ${WG_PASSWORD_HASH}
      WG_DEFAULT_DNS: ${NAS_LAN_IP}
      WG_PORT: "51820"
    ports:
      - "51820:51820/udp"
    volumes:
      - ${DATA_ROOT}/system/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge
