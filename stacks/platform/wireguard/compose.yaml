# wg-easy v15 ignores v14 PASSWORD_HASH / WG_HOST env.
# Dedicated 10.42.42.0/24 network, INSECURE=true behind Caddy.
# edge + wg: pin wg as eth0 or PostUp NAT and wg-quick fail (no wg0).

services:
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wireguard
    restart: unless-stopped
    privileged: true
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      TZ: ${TZ}
      PORT: "51821"
      INSECURE: "true"
      DISABLE_IPV6: "true"
      INIT_ENABLED: "true"
      INIT_USERNAME: wg-admin
      INIT_PASSWORD: ${WG_UI_PASSWORD}
      INIT_HOST: ${WG_HOST}
      INIT_PORT: "51820"
      INIT_DNS: ${NAS_LAN_IP}
    ports:
      - "51820:51820/udp"
    volumes:
      - ${DATA_ROOT}/system/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    networks:
      wg:
        interface_name: eth0
        gw_priority: 1
        ipv4_address: 10.42.42.42
      edge:
        interface_name: eth1
        gw_priority: 0

networks:
  edge:
    external: true
    name: edge
  wg:
    driver: bridge
    ipam:
      config:
        - subnet: 10.42.42.0/24
