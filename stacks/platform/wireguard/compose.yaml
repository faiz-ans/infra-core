# wg-easy v15 ignores v14 PASSWORD_HASH / WG_HOST env.
# It expects a dedicated 10.42.42.0/24 network and INSECURE=true behind Caddy.

services:
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wireguard
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      INSECURE: "true"
      DISABLE_IPV6: "true"
      INIT_ENABLED: "true"
      INIT_USERNAME: wg-admin
      INIT_PASSWORD: ${WG_UI_PASSWORD}
      INIT_HOST: ${WG_HOST}
      INIT_PORT: "51820"
      INIT_DNS: ${NAS_LAN_IP}
    ports:
      - "51820:51820/udp"
    volumes:
      - ${DATA_ROOT}/system/core/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    # Official v15 compose. Without the ipv6 sysctls, wg-quick often fails
    # (ip6tables / RTNETLINK) and the UI shows "server error" on client create.
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    networks:
      edge: {}
      wg:
        ipv4_address: 10.42.42.42

networks:
  edge:
    external: true
    name: edge
  wg:
    driver: bridge
    ipam:
      config:
        - subnet: 10.42.42.0/24
