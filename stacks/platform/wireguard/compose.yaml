# Host network: VPN uses Core's NIC (DNS at NAS_LAN_IP, NAT on the real
# uplink). Caddy stays on edge and reaches the UI at host.docker.internal:51821.
# Do not attach this container to edge. seed-mtu.mjs rewrites factory MTU
# 1420 → 1280 in the data volume (operator-chosen MTU is left alone).
# wg-easy v15 ignores v14 PASSWORD_HASH / WG_HOST env.

services:
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wireguard
    restart: unless-stopped
    privileged: true
    network_mode: host
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      TZ: ${TZ}
      PORT: "51821"
      INSECURE: "true"
      DISABLE_IPV6: "true"
      INIT_ENABLED: "true"
      INIT_USERNAME: wg-admin
      INIT_PASSWORD: ${WG_UI_PASSWORD}
      INIT_HOST: ${WG_HOST}
      INIT_PORT: "51820"
      INIT_DNS: ${NAS_LAN_IP}
    volumes:
      - ${DATA_ROOT}/system/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./seed-mtu.mjs:/seed-mtu.mjs:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
