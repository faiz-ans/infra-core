# ARCHIVED snippets for services.yaml — not live.
# Restore under System → Monitoring / Network as needed.

# Native Glances (Core) with metric: info
        - Glances:
            href: https://host.{{HOMEPAGE_VAR_DOMAIN}}
            server: core
            container: glances
            icon: glances.svg
            description: Host Monitor
            widget:
                type: glances
                url: http://glances:61208
                version: 4
                metric: info

# Paired HTPC Glances (requires flip JS)
        - Glances HTPC:
            href: https://host2.{{HOMEPAGE_VAR_DOMAIN}}
            server: periphery
            container: glances-periphery
            icon: glances.svg
            description: Host Monitor
            widget:
                type: glances
                url: http://{{HOMEPAGE_VAR_HTPC_UPSTREAM}}:61208
                version: 4
                metric: info

# Paired HTPC Pi-hole (requires flip JS; keep Core Pi-hole entry in live file)
        - Pi-hole HTPC:
            href: https://dns2.{{HOMEPAGE_VAR_DOMAIN}}/admin
            server: periphery
            container: pihole-periphery
            icon: pi-hole.svg
            description: DNS
            widget:
                type: pihole
                url: http://{{HOMEPAGE_VAR_HTPC_UPSTREAM}}:8083
                version: 6
                key: "{{HOMEPAGE_VAR_PIHOLE_PERIPHERY_TOKEN}}"
                fields:
                - queries
                - blocked_percent
                - gravity
