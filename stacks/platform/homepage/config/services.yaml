- Apps:
    - Nextcloud:
        href: https://nextcloud.{{HOMEPAGE_VAR_DOMAIN}}
        siteMonitor: http://{{HOMEPAGE_VAR_HTPC_UPSTREAM}}:8080
        icon: nextcloud.png
        description: Docs / Photos
    - Home Assistant:
        href: https://ha.{{HOMEPAGE_VAR_DOMAIN}}
        siteMonitor: http://{{HOMEPAGE_VAR_HTPC_UPSTREAM}}:8123
        icon: home-assistant.png
        description: Home Automation
    - Vaultwarden:
        href: https://pw.{{HOMEPAGE_VAR_DOMAIN}}
        siteMonitor: http://vaultwarden:80
        icon: bitwarden.png
        description: Passwords
    - Jellyfin:
        href: https://jellyfin.{{HOMEPAGE_VAR_DOMAIN}}
        siteMonitor: http://{{HOMEPAGE_VAR_HTPC_UPSTREAM}}:8096
        icon: jellyfin.png
        description: Movies & TV
