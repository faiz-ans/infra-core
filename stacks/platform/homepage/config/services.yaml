    - Network:
        - Pi-hole:
            href: https://dns.{{HOMEPAGE_VAR_DOMAIN}}/admin
            server: core
            container: pihole
            icon: pi-hole.png
            description: DNS
            widget:
                type: pihole
                url: http://pihole:80
                version: 6
                fields:
                - queries
                - blocked_percent
                - gravity
