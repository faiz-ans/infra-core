- Apps:
    - Local:
        - Nextcloud:
            href: https://nextcloud.{{HOMEPAGE_VAR_DOMAIN}}
            siteMonitor: http://{{HOMEPAGE_VAR_HTPC_UPSTREAM}}:8080
            icon: nextcloud.png
            description: Docs / Photos
        - Home Assistant:
            href: https://ha.{{HOMEPAGE_VAR_DOMAIN}}
            siteMonitor: http://{{HOMEPAGE_VAR_HTPC_UPSTREAM}}:8123
            icon: home-assistant.png
            description: Home Automation
        - Vaultwarden:
            href: https://pw.{{HOMEPAGE_VAR_DOMAIN}}
            siteMonitor: http://vaultwarden:80
            icon: bitwarden.png
            description: Passwords
        - Jellyfin:
            href: https://jellyfin.{{HOMEPAGE_VAR_DOMAIN}}
            siteMonitor: http://{{HOMEPAGE_VAR_HTPC_UPSTREAM}}:8096
            icon: jellyfin.png
            description: Movies & TV
    - Web:
        - Gmail:
            href: https://gmail.com
            siteMonitor: http://gmail.com
            icon: gmail.png
            description: Gmail
        - YouTube:
            href: https://youtube.com
            siteMonitor: http://youtube.com
            icon: youtube.png
            description: YouTube
        - Amazon Prime:
            href: https://amazon.com
            siteMonitor: http://amazon.com
            icon: amazon.png
            description: Amazon Prime

- System:
    - Downloads:
        - Sonarr:
            href: https://sonarr.{{HOMEPAGE_VAR_DOMAIN}}
            siteMonitor: http://{{HOMEPAGE_VAR_HTPC_UPSTREAM}}:8989
            icon: sonarr.png
            description: Lookup TV Shows
        - Radarr:
            href: https://radarr.{{HOMEPAGE_VAR_DOMAIN}}
            siteMonitor: http://{{HOMEPAGE_VAR_HTPC_UPSTREAM}}:7878
            icon: radarr.png
            description: Lookup Movies
        - qBittorrent:
            href: https://qbit.{{HOMEPAGE_VAR_DOMAIN}}
            siteMonitor: http://{{HOMEPAGE_VAR_HTPC_UPSTREAM}}:8081
            icon: qbittorrent.png
            description: Downloads
    - Network:
        - Pi-hole Core:
            href: https://dns.{{HOMEPAGE_VAR_DOMAIN}}/admin
            siteMonitor: http://pihole:80/admin
            icon: pi-hole.png
            description: DNS (Primary)
            widget:
              type: pihole
              url: http://pihole:80
              version: 6
              fields:
                - queries
                - blocked_percent
                - gravity
        - Pi-hole Periphery:
            href: https://dns2.{{HOMEPAGE_VAR_DOMAIN}}/admin
            siteMonitor: http://{{HOMEPAGE_VAR_HTPC_UPSTREAM}}:8083/admin
            icon: pi-hole.png
            description: DNS (Secondary)
        - WireGuard:
            href: https://vpn.{{HOMEPAGE_VAR_DOMAIN}}
            siteMonitor: http://wireguard:51821
            icon: wireguard.png
            description: VPN
            #widget:
            #  type: wgeasy
            #  url: http://wireguard:51821
            #  version: 2
            #  username: wg-admin
            #  password: "{{HOMEPAGE_VAR_WGEASY_PASSWORD}}"
            #  fields:
            #    - connected
    - Platform:
        - Komodo:
            href: https://ops.{{HOMEPAGE_VAR_DOMAIN}}
            siteMonitor: http://{{HOMEPAGE_VAR_NAS_LAN_IP}}:9120
            icon: docker.png
            description: Deployment
        - OpenMediaVault:
            href: https://nas.{{HOMEPAGE_VAR_DOMAIN}}
            siteMonitor: http://{{HOMEPAGE_VAR_NAS_LAN_IP}}:81
            icon: openmediavault.png
            description: Storage
        - Grafana:
            href: https://grafana.{{HOMEPAGE_VAR_DOMAIN}}
            siteMonitor: http://{{HOMEPAGE_VAR_HTPC_UPSTREAM}}:3000
            icon: grafana.png
            description: Monitoring
