- System:
    - Media Backend:
        - qBittorrent:
            href: https://down.{{HOMEPAGE_VAR_DOMAIN}}
            server: periphery
            container: qbittorrent
            icon: qbittorrent.svg
            description: Downloads      
        - Prowlarr:
            href: https://prowlarr.{{HOMEPAGE_VAR_DOMAIN}}
            server: periphery
            container: prowlarr
            icon: prowlarr.svg
            description: Indices      
        - Radarr:
            href: https://radarr.{{HOMEPAGE_VAR_DOMAIN}}
            server: periphery
            container: radarr
            icon: radarr.svg
            description: Request Movies    
        - Sonarr:
            href: https://sonarr.{{HOMEPAGE_VAR_DOMAIN}}
            server: periphery
            container: sonarr
            icon: sonarr.svg
            description: Request TV Shows

    - Platform:
        - OpenMediaVault:
            href: https://nas.{{HOMEPAGE_VAR_DOMAIN}}
            siteMonitor: http://{{HOMEPAGE_VAR_NAS_LAN_IP}}:81
            icon: openmediavault.svg
            description: Storage
            widget:
                type: openmediavault
                url: http://{{HOMEPAGE_VAR_NAS_LAN_IP}}:81
                username: "{{HOMEPAGE_VAR_OMV_USERNAME}}"
                password: "{{HOMEPAGE_VAR_OMV_PASSWORD}}"
                method: smart.getListBg
        - Komodo:
            href: https://ops.{{HOMEPAGE_VAR_DOMAIN}}
            siteMonitor: http://{{HOMEPAGE_VAR_NAS_LAN_IP}}:9120
            icon: docker.svg
            description: Deployment
            widget:
                type: komodo
                url: http://{{HOMEPAGE_VAR_NAS_LAN_IP}}:9120
                key: "{{HOMEPAGE_VAR_KOMODO_KEY}}"
                secret: "{{HOMEPAGE_VAR_KOMODO_SECRET}}"
                showSummary: true
        - Authelia:
            href: https://auth.{{HOMEPAGE_VAR_DOMAIN}}
            server: core
            container: authelia
            icon: authelia.svg
            description: Authentication
        - Gitea:
            href: https://git.{{HOMEPAGE_VAR_DOMAIN}}
            server: core
            container: gitea
            icon: gitea.svg
            description: Version Control

    - Network:
        - Pi-hole:
            href: https://dns.{{HOMEPAGE_VAR_DOMAIN}}/admin
            server: core
            container: pihole
            icon: pi-hole.svg
            description: DNS
            widget:
                type: pihole
                url: http://pihole
                version: 6
                key: "{{HOMEPAGE_VAR_PIHOLE_TOKEN}}"
                fields:
                - queries
                - blocked_percent
                - gravity
        - WireGuard:
            href: https://vpn.{{HOMEPAGE_VAR_DOMAIN}}
            server: core
            container: wireguard
            icon: wireguard.svg
            description: VPN
        - RustDesk:
            href: https://desk.{{HOMEPAGE_VAR_DOMAIN}}
            server: core
            container: hbbs
            icon: rustdesk.png
            description: Remote Desktop
        - Linksys EA8300:
            href: https://wifi.{{HOMEPAGE_VAR_DOMAIN}}
            siteMonitor: https://192.168.1.1/
            icon: linksys.svg
            description: Router
        - HP LaserJet M29w:
            href: https://print.{{HOMEPAGE_VAR_DOMAIN}}
            siteMonitor: https://192.168.1.113/
            icon: hp.svg
            description: Printer

    - Monitoring:
        - Grafana:
            href: https://stats.{{HOMEPAGE_VAR_DOMAIN}}
            server: periphery
            container: grafana
            icon: grafana.svg
            description: Site Monitor
        - Prometheus:
            href: https://metrics.{{HOMEPAGE_VAR_DOMAIN}}
            server: periphery
            container: prometheus
            icon: prometheus.svg
            description: Metrics
        - Glances:
            href: https://glances.{{HOMEPAGE_VAR_DOMAIN}}
            server: periphery
            container: glances
            icon: glances.svg
            description: Host Monitor
            widget:
                type: glances
                url: http://glances:61208
                version: 4
                metric: info
