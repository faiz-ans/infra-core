# Datetime
- datetime:
    text_size: xl
    format:
      timeStyle: short
      dateStyle: medium

# Weather
- openmeteo:
    latitude: {{HOMEPAGE_VAR_WEATHER_LATITUDE}}
    longitude: {{HOMEPAGE_VAR_WEATHER_LONGITUDE}}
    timezone: "{{HOMEPAGE_VAR_TZ}}"
    units: imperial
    cache: 5

# Searchbar
#- search:
#    provider: duckduckgo
#    target: _blank

# Core Glances
- glances:
    url: http://glances:61208
    href: https://glances.{{HOMEPAGE_VAR_DOMAIN}}
    version: 4
    cpu: true
    mem: true
    cputemp: true
    uptime: true
    disk:
      - /mnt/data
