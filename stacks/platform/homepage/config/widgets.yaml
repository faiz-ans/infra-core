- datetime:
    text_size: xl
    format:
      timeStyle: short
      dateStyle: medium

- openmeteo:
    latitude: {{HOMEPAGE_VAR_WEATHER_LATITUDE}}
    longitude: {{HOMEPAGE_VAR_WEATHER_LONGITUDE}}
    timezone: "{{HOMEPAGE_VAR_TZ}}"
    units: imperial
    cache: 5

#- search:
#    provider: duckduckgo
#    target: _blank

- glances:
    url: http://glances:61208
    version: 4
    cpu: true
    mem: true
    cputemp: true
    uptime: true
    disk:
      - /mnt/data
    label: Core

- glances:
    url: http://{{HOMEPAGE_VAR_HTPC_UPSTREAM}}:61208
    version: 4
    cpu: true
    mem: true
    uptime: true
    disk:
      - /mnt/windows
    label: Periphery
