services:
  dockerproxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: homepage-dockerproxy
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      CONTAINERS: 1
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    networks:
      - edge

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    depends_on:
      - dockerproxy
    env_file:
      - .env
    environment:
      TZ: ${TZ}
      NODE_OPTIONS: --dns-result-order=ipv4first
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
      HOMEPAGE_VAR_DOMAIN: ${HOMEPAGE_VAR_DOMAIN}
      HOMEPAGE_VAR_HTPC_UPSTREAM: ${HOMEPAGE_VAR_HTPC_UPSTREAM}
      HOMEPAGE_VAR_NAS_LAN_IP: ${HOMEPAGE_VAR_NAS_LAN_IP}
      HOMEPAGE_VAR_PIHOLE_TOKEN: ${HOMEPAGE_VAR_PIHOLE_TOKEN}
      HOMEPAGE_VAR_JELLYFIN_KEY: ${HOMEPAGE_VAR_JELLYFIN_KEY}
      HOMEPAGE_VAR_SONARR_KEY: ${HOMEPAGE_VAR_SONARR_KEY}
      HOMEPAGE_VAR_RADARR_KEY: ${HOMEPAGE_VAR_RADARR_KEY}
      HOMEPAGE_VAR_PROWLARR_KEY: ${HOMEPAGE_VAR_PROWLARR_KEY}
      HOMEPAGE_VAR_QBIT_USERNAME: ${HOMEPAGE_VAR_QBIT_USERNAME}
      HOMEPAGE_VAR_QBIT_PASSWORD: ${HOMEPAGE_VAR_QBIT_PASSWORD}
      HOMEPAGE_VAR_GRAFANA_KEY: ${HOMEPAGE_VAR_GRAFANA_KEY}
      HOMEPAGE_VAR_WGEASY_PASSWORD: ${HOMEPAGE_VAR_WGEASY_PASSWORD}
      HOMEPAGE_VAR_TZ: ${TZ}
      HOMEPAGE_VAR_WEATHER_LATITUDE: "${WEATHER_LATITUDE}"
      HOMEPAGE_VAR_WEATHER_LONGITUDE: "${WEATHER_LONGITUDE}"
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    entrypoint: ["/bin/sh", "/seed-images.sh"]
    volumes:
      - ./config:/app/config
      # Next.js serves /images/* from /app/public/images. Persist on DATA_ROOT
      # so an empty Komodo clone does not hide background.png.
      - ${DATA_ROOT}/system/homepage/images:/app/public/images
      - ./images:/git-images:ro
      - ./seed-images.sh:/seed-images.sh:ro
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge
