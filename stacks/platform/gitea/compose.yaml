# Gitea on Core. SQLite is enough for this catalog. HTTP is Caddy-only (no Authelia
# forward-auth: git clone/push and Komodo must not hit a login wall). Browser SSO is
# Authelia OIDC (see bootstrap/gitea.md). Git over HTTPS via Caddy;
# in-container SSH is off (it crash-loops on this host and whites out Homepage).
services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: git.${DOMAIN}
      GITEA__server__ROOT_URL: https://git.${DOMAIN}/
      GITEA__server__HTTP_ADDR: 0.0.0.0
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__START_SSH_SERVER: "false"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__USERNAME: preferred_username
      GITEA__oauth2_client__ACCOUNT_LINKING: login
      GITEA__actions__ENABLED: "false"
      GITEA__mirror__INTERVAL: 10m
      # Go SystemCertPool: keep public CAs and add Caddy tls internal.
      SSL_CERT_DIR: /etc/ssl/certs:/etc/ssl/caddy
    extra_hosts:
      - "auth.${DOMAIN}:${NAS_LAN_IP}"
    volumes:
      - ${DATA_ROOT}/system/gitea:/data
      # File must exist before first start (Docker will otherwise create a directory).
      # See bootstrap/gitea.md.
      - ${DATA_ROOT}/system/authelia/caddy-root.crt:/etc/ssl/caddy/caddy-root.crt:ro
    networks:
      - edge
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  gitea-oidc:
    image: gitea/gitea:latest
    container_name: gitea-oidc
    depends_on:
      gitea:
        condition: service_healthy
    restart: on-failure
    environment:
      TZ: ${TZ}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      DOMAIN: ${DOMAIN}
      SSL_CERT_DIR: /etc/ssl/certs:/etc/ssl/caddy
    extra_hosts:
      - "auth.${DOMAIN}:${NAS_LAN_IP}"
    volumes:
      - ${DATA_ROOT}/system/gitea:/data
      - ${DATA_ROOT}/system/authelia/caddy-root.crt:/etc/ssl/caddy/caddy-root.crt:ro
      - ./seed-oidc.sh:/seed-oidc.sh:ro
    networks:
      - edge
    entrypoint: ["/bin/bash", "/seed-oidc.sh"]

networks:
  edge:
    external: true
    name: edge
