# BACKUP_DRIVE is the USB root Docker Desktop can bind (this site: D:).
# Host paths: ${BACKUP_DRIVE}/restic (repo) and ${BACKUP_DRIVE}/htpasswd (file).
# restic/rest-server CMD is /entrypoint.sh (not rest-server). Do not set command:
# to flags; that execs "--path" and the container fails to start.
services:
  restic-rest:
    image: restic/rest-server:latest
    container_name: restic-rest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: ${TZ}
      DATA_DIRECTORY: /data
      PASSWORD_FILE: /htpasswd
      OPTIONS: "--listen :8000"
    volumes:
      - ${BACKUP_DRIVE}/restic:/data
      - ${BACKUP_DRIVE}/htpasswd:/htpasswd:ro
