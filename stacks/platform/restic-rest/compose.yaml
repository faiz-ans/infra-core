# BACKUP_DRIVE is the USB root Docker Desktop can bind (this site: D:).
# Host paths: ${BACKUP_DRIVE}/restic (repo) and ${BACKUP_DRIVE}/htpasswd (file).
services:
  restic-rest:
    image: restic/rest-server:latest
    container_name: restic-rest
    restart: unless-stopped
    command:
      - --path
      - /data
      - --htpasswd-file
      - /htpasswd
      - --listen
      - :8000
    ports:
      - "8000:8000"
    environment:
      TZ: ${TZ}
    volumes:
      - ${BACKUP_DRIVE}/restic:/data
      - ${BACKUP_DRIVE}/htpasswd:/htpasswd:ro
