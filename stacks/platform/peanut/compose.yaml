# PeaNUT: HTTP API/UI in front of host NUT (CyberPower ST625U).
# No published ports. Homepage scrapes http://peanut:8080 on edge.
# Browser UI is https://ups.<DOMAIN> through Caddy.
# NUT listens on the host (:3493) when OMV remote monitoring is on
# (bootstrap/omv/omv-nut.sh). Do not WAN-forward 3493.
services:
  peanut:
    image: brandawg93/peanut:latest
    container_name: peanut
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ}
      NUT_HOST: host.docker.internal
      NUT_PORT: 3493
      USERNAME: peanut
      PASSWORD: ${NUT_REMOTE_PASSWORD}
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
      AUTH_DISABLED: "true"
    volumes:
      - ${DATA_ROOT}/system/peanut:/config
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge
