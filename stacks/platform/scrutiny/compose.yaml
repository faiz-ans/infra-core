# Scrutiny hub on Core (web + InfluxDB + local collector).
# IronWolf (and any other NAS disks) are collected here. The HTPC USB backup
# drive cannot be SMART-scanned from Docker Desktop; that spoke is the
# Windows collector under windows/scrutiny-collector/.
# Browser UI is https://disks.<DOMAIN> through Caddy (Authelia).
# LAN :8080 is bound to NAS_LAN_IP only so the HTPC collector can POST.
services:
  scrutiny:
    image: ghcr.io/analogj/scrutiny:latest-omnibus
    container_name: scrutiny
    restart: unless-stopped
    privileged: true
    environment:
      TZ: ${TZ}
      COLLECTOR_HOST_ID: core
      COLLECTOR_CRON_SCHEDULE: "0 6 * * *"
      COLLECTOR_RUN_STARTUP: "true"
    ports:
      - "${NAS_LAN_IP}:8080:8080"
    volumes:
      - ${DATA_ROOT}/system/scrutiny/config:/opt/scrutiny/config
      - ${DATA_ROOT}/system/scrutiny/influxdb:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
      - /dev:/dev
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge
