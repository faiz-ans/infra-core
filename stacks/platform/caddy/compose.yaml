services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Caddyfile updates: Komodo config_files requires Redeploy. Do not use
    # --watch on this bind-mount (it reloads in a loop).
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      DOMAIN: ${DOMAIN}
      HTPC_UPSTREAM: ${HTPC_UPSTREAM}
      TZ: ${TZ}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./export-ca.sh:/export-ca.sh:ro
      - caddy-data:/data
      - caddy-config:/config
      - ${DATA_ROOT}/system/authelia:/export-ca
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge

volumes:
  caddy-data:
  caddy-config:
