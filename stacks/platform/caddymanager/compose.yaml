# CaddyManager on Core. Experiment: web UI for the site Caddy admin API.
# GitOps still owns stacks/platform/caddy/Caddyfile. UI edits are not the
# source of truth; a Caddy Redeploy reloads the catalog Caddyfile.
# Admin API is on the edge network only (not published on the host).
# deploy = false until you opt in.
services:
  caddymanager-backend:
    image: caddymanager/caddymanager-backend:latest
    container_name: caddymanager-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PORT: "3000"
      DB_ENGINE: sqlite
      SQLITE_DB_PATH: /app/data/caddymanager.sqlite
      CORS_ORIGIN: https://traffic.${DOMAIN}
      LOG_LEVEL: info
      CADDY_SANDBOX_URL: http://caddy:2019
      PING_INTERVAL: "30000"
      PING_TIMEOUT: "2000"
      AUDIT_LOG_MAX_SIZE_MB: "100"
      AUDIT_LOG_RETENTION_DAYS: "90"
      JWT_SECRET: ${CADDYMANAGER_JWT_SECRET}
      JWT_EXPIRATION: 24h
    volumes:
      - ${DATA_ROOT}/system/caddymanager:/app/data
    networks:
      - edge

  caddymanager-frontend:
    image: caddymanager/caddymanager-frontend:latest
    container_name: caddymanager-frontend
    restart: unless-stopped
    depends_on:
      - caddymanager-backend
    environment:
      TZ: ${TZ}
      BACKEND_HOST: caddymanager-backend:3000
      APP_NAME: Caddy Manager
      DARK_MODE: "true"
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge
