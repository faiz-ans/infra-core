# Request UI for Jellyfin. Config is local (SQLite). No media mounts.
# This site’s ResourceSync uses this file (no NFS). Do not merge a second compose file.
services:
  jellyseerr:
    image: ghcr.io/fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    init: true
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    ports:
      - "5055:5055"
    volumes:
      - jellyseerr-config:/app/config

volumes:
  jellyseerr-config:
    name: jellyseerr-config
