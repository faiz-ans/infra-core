# Jotty on Core. Notes/checklists are files under system/jotty. Caddy on edge.
services:
  jotty:
    image: ghcr.io/fccview/jotty:latest
    container_name: jotty
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      NODE_ENV: production
      PUID: ${PUID}
      PGID: ${PGID}
      APP_URL: https://notes.${DOMAIN}
      HTTPS: "true"
      AUTH_MODE: oidc
      OIDC_ISSUER: https://auth.${DOMAIN}
      OIDC_CLIENT_ID: jotty
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      SSO_FALLBACK_LOCAL: "yes"
      OIDC_USER_GROUPS: users
      INTERNAL_API_URL: http://127.0.0.1:3000
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    extra_hosts:
      - "auth.${DOMAIN}:${NAS_LAN_IP}"
    volumes:
      - ${DATA_ROOT}/system/jotty/data:/app/data
      - ${DATA_ROOT}/system/jotty/config:/app/config
      - ${DATA_ROOT}/system/jotty/cache:/app/.next/cache
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge
