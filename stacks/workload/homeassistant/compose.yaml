# /config is a local volume. trusted_proxies is written at start (same as compose.nfs.yaml).
# Docker-engine NFS (no host mount): deploy compose.nfs.yaml instead.
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      NAS_LAN_IP: ${NAS_LAN_IP}
    entrypoint: ["/bin/sh", "-c"]
    command: ["python3 /ensure-http/patch.py && exec /init"]
    ports:
      - "8123:8123"
    volumes:
      - ha-config:/config
      - ./ensure-http:/ensure-http:ro
    # Official image healthcheck uses HTTP to localhost. Docker Desktop often
    # injects HTTP_PROXY, which makes that probe fail while the UI still works.
    # Homepage maps Docker "unhealthy" to an orange status dot.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "HTTP_PROXY= HTTPS_PROXY= http_proxy= https_proxy= python3 -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8123/', timeout=8)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    # wifi / integrations only; no USB radio passthrough

volumes:
  ha-config:
