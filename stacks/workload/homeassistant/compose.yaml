# Bind mounts via DATA_ROOT (local disk, host NFS, or host SMB/CIFS).
# Docker-engine NFS (no host mount): deploy compose.nfs.yaml instead.
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - "8123:8123"
    volumes:
      - ${DATA_ROOT}/system/periphery/homeassistant:/config
      - ./configuration.yaml:/config/configuration.yaml:ro
    # wifi / integrations only; no USB radio passthrough
