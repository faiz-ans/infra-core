# /config is a local volume + catalog configuration.yaml bind (same as compose.nfs.yaml).
# Docker-engine NFS (no host mount): deploy compose.nfs.yaml instead.
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - "8123:8123"
    volumes:
      - ha-config:/config
      - ./configuration.yaml:/config/configuration.yaml:ro
    # wifi / integrations only; no USB radio passthrough

volumes:
  ha-config:
