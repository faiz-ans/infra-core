# Docker NFS volume driver. Same tree as compose.yaml; engine mounts OMV itself.
# Deploy this file instead of compose.yaml (do not merge both).
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    entrypoint: ["/bin/sh", "/infra/ensure-proxy.sh"]
    ports:
      - "8123:8123"
    volumes:
      - homeassistant-config:/config
      - ./ensure-proxy.sh:/infra/ensure-proxy.sh:ro
    # wifi / integrations only; no USB radio passthrough
    # Do not bind-mount configuration.yaml over the NFS /config — Docker drops that overlay.

volumes:
  homeassistant-config:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_LAN_IP},nfsvers=4,rw,nolock,hard
      device: ":${NFS_EXPORT}/system/periphery/homeassistant"
