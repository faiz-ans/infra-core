# Recordings on Docker NFS (shared/cameras). /config is a local volume.
# Deploy this file instead of compose.yaml (do not merge both).
# Caddy terminates TLS at cams.${DOMAIN}. Seed config is copied only when
# the volume has no config.yml. Do not privileged; no Coral/GPU devices.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: frigate-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto:/mosquitto/config:ro

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "256mb"
    depends_on:
      - mosquitto
    environment:
      TZ: ${TZ}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /config/config.yml ] && [ ! -f /config/config.yaml ]; then
          cp /seed/config.yml /config/config.yml
        fi
        exec /init
    ports:
      - "8971:8971"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    volumes:
      - frigate-config:/config
      - frigate-media:/media/frigate
      - ./seed:/seed:ro
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000

volumes:
  frigate-config:
    name: frigate-config
  frigate-media:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_LAN_IP},nfsvers=4,rw,nolock,hard
      device: ":${NFS_EXPORT}/cameras"
