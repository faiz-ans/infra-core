# Transmute on periphery. FFmpeg conversions are local HTPC volumes (not NFS).
# Caddy terminates TLS at convert.${DOMAIN}. First visit creates the admin.
# NVIDIA for FFmpeg NVENC. Draw.io Electron is stubbed at boot (entrypoint-oidc.sh);
# that probe crashed WSL2 even when the GPU assignment was unchanged.
services:
  transmute:
    image: ghcr.io/transmute-app/transmute:latest
    container_name: transmute
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      TZ: ${TZ}
      AUTH_SECRET_KEY: ${TRANSMUTE_AUTH_SECRET_KEY}
      APP_URL: https://convert.${DOMAIN}
      PORT: "3313"
      OIDC_ISSUER_URL: https://auth.${DOMAIN}
      OIDC_CLIENT_ID: transmute
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_DISPLAY_NAME: Authelia
      OIDC_AUTO_CREATE_USERS: "true"
      OIDC_AUTO_LAUNCH: "false"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    extra_hosts:
      - "auth.${DOMAIN}:${NAS_LAN_IP}"
    entrypoint: ["/bin/bash", "/oidc-ca.sh"]
    ports:
      - "3313:3313"
    volumes:
      - transmute-data:/app/data
      - ./entrypoint-oidc.sh:/oidc-ca.sh:ro
      - ./sitecustomize-oidc.py:/oidc-sitecustomize.py:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "-q"
        - "-O"
        - "/dev/null"
        - "--tries=1"
        - "http://localhost:3313/api/health/ready"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  transmute-data:
    name: transmute-data
