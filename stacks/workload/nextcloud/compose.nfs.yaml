# Docker NFS volume driver. Same tree as compose.yaml; engine mounts OMV itself.
# Deploy this file instead of compose.yaml (do not merge both).
services:
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: nextcloud.${DOMAIN}
    ports:
      # linuxserver Nextcloud listens on 443 inside the container, not 80.
      - "8080:443"
    volumes:
      - nextcloud-config:/config
      - nextcloud-files:/data/shared/files
      - nextcloud-photos:/data/shared/photos
      - nextcloud-users:/data/users

volumes:
  nextcloud-config:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_LAN_IP},nfsvers=4,rw,nolock,hard
      device: ":${NFS_EXPORT}/system/periphery/nextcloud"
  nextcloud-files:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_LAN_IP},nfsvers=4,rw,nolock,hard
      device: ":${NFS_EXPORT}/shared/files"
  nextcloud-photos:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_LAN_IP},nfsvers=4,rw,nolock,hard
      device: ":${NFS_EXPORT}/shared/photos"
  nextcloud-users:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_LAN_IP},nfsvers=4,rw,nolock,hard
      device: ":${NFS_EXPORT}/users"
