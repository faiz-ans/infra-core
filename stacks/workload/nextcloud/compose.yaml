# Household data via DATA_ROOT binds. /config and Postgres are local volumes
# (same as compose.nfs.yaml). Docker-engine NFS: deploy compose.nfs.yaml instead.
services:
  postgres:
    image: postgres:16-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - nextcloud-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Do not publish 5432. Installer host is Compose DNS `postgres`.

  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: nextcloud.${DOMAIN}
      DOMAIN: ${DOMAIN}
    ports:
      # linuxserver Nextcloud listens on 443 inside the container, not 80.
      - "8080:443"
    volumes:
      - nextcloud-config:/config
      - ${DATA_ROOT}/shared/files:/data/shared/files
      - ${DATA_ROOT}/shared/photos:/data/shared/photos
      - ${DATA_ROOT}/users:/data/users
      - ./custom-cont-init.d:/custom-cont-init.d:ro

volumes:
  nextcloud-config:
    name: nextcloud-config
  nextcloud-postgres:
    name: nextcloud-postgres
