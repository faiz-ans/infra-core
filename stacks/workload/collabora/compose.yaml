# Collabora Online on periphery. Caddy terminates TLS at office.${DOMAIN}.
# Official overlay: https://github.com/opencloud-eu/opencloud-compose/blob/main/weboffice/collabora.yml
# CODE 26 is distroless (no bash/curl). Do not wrap the image entrypoint.
# Image HEALTHCHECK (coolwsd --probe) dials https://127.0.0.1:9980 even with
# ssl.enable=false (CollaboraOnline/online#16032). Disable it so Komodo is
# not stuck Unhealthy. WOPI still HTTPS-calls cloud.${DOMAIN}; collabora-ca
# stays up with Caddy's tls-internal CA on a volume (SSL_CERT_FILE).
services:
  collabora-ca:
    image: alpine:3.21
    container_name: collabora-ca
    restart: unless-stopped
    extra_hosts:
      - "auth.${DOMAIN}:${NAS_LAN_IP}"
    environment:
      CADDY_CA_URL: https://auth.${DOMAIN}/pki/local-root.crt
    volumes:
      - collabora-ca:/ca
    command:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache ca-certificates curl
        i=0
        while [ "$$i" -lt 30 ]; do
          if curl -kfsSL --max-time 5 "$$CADDY_CA_URL" -o /ca/caddy-local.crt; then
            cat /etc/ssl/certs/ca-certificates.crt /ca/caddy-local.crt > /ca/ca-bundle.crt
            echo "collabora-ca: wrote /ca/ca-bundle.crt"
            exec sleep infinity
          fi
          i=$$((i + 1))
          sleep 2
        done
        echo "collabora-ca: could not fetch $$CADDY_CA_URL" >&2
        exit 1
    healthcheck:
      test: ["CMD-SHELL", "test -s /ca/ca-bundle.crt"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  collabora:
    image: collabora/code:latest
    container_name: collabora
    restart: unless-stopped
    depends_on:
      collabora-ca:
        condition: service_healthy
    extra_hosts:
      - "cloud.${DOMAIN}:${NAS_LAN_IP}"
      - "office.${DOMAIN}:${NAS_LAN_IP}"
      - "auth.${DOMAIN}:${NAS_LAN_IP}"
    environment:
      TZ: ${TZ}
      DONT_GEN_SSL_CERT: "YES"
      SSL_CERT_FILE: /ca/ca-bundle.crt
      # hostname:443 so the editor opens wss://office.${DOMAIN}/… not :9980
      # (9980 is published on the HTPC; browsers reach Collabora only via Caddy :443).
      server_name: office.${DOMAIN}:443
      aliasgroup1: https://cloud.${DOMAIN}:443
      extra_params: "--o:ssl.enable=false --o:ssl.ssl_verification=false --o:ssl.termination=true --o:welcome.enable=false --o:server_name=office.${DOMAIN}:443 --o:net.frame_ancestors=cloud.${DOMAIN} --o:net.lok_allow.host[14]=cloud.${DOMAIN}"
    volumes:
      - collabora-ca:/ca:ro
    ports:
      - "9980:9980"
    cap_add:
      - MKNOD
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    healthcheck:
      disable: true

volumes:
  collabora-ca:
