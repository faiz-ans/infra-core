# Collabora Online on periphery. Caddy terminates TLS at office.${DOMAIN}.
# Official overlay: https://github.com/opencloud-eu/opencloud-compose/blob/main/weboffice/collabora.yml
# WOPI allowlist is aliasgroup1 (OpenCloud public hostname). ssl.enable is
# false because Caddy terminates TLS. Collabora still HTTPS-calls
# https://cloud.${DOMAIN} for CheckFileInfo; entrypoint-ca.sh installs
# Caddy's tls-internal CA (CODE ignores ssl.ssl_verification on that path).
services:
  collabora:
    image: collabora/code:latest
    container_name: collabora
    restart: unless-stopped
    extra_hosts:
      - "cloud.${DOMAIN}:${NAS_LAN_IP}"
      - "office.${DOMAIN}:${NAS_LAN_IP}"
      - "auth.${DOMAIN}:${NAS_LAN_IP}"
    entrypoint: ["/bin/bash", "/entrypoint-ca.sh"]
    environment:
      TZ: ${TZ}
      DONT_GEN_SSL_CERT: "YES"
      server_name: office.${DOMAIN}
      aliasgroup1: https://cloud.${DOMAIN}:443
      extra_params: >
        --o:ssl.enable=false
        --o:ssl.ssl_verification=false
        --o:ssl.termination=true
        --o:welcome.enable=false
        --o:net.frame_ancestors=cloud.${DOMAIN}
        --o:net.lok_allow.host[14]=cloud.${DOMAIN}
    volumes:
      - ./entrypoint-ca.sh:/entrypoint-ca.sh:ro
    ports:
      - "9980:9980"
    cap_add:
      - MKNOD
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
