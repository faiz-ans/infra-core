# Household data via DATA_ROOT binds. /config is a local volume (same as compose.nfs.yaml).
# Docker-engine NFS (no host mount): deploy compose.nfs.yaml instead.
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - "8989:8989"
    volumes:
      - sonarr-config:/config
      - ${DATA_ROOT}/shared/media:/data/media
      - ${DATA_ROOT}/shared/downloads:/downloads

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - "7878:7878"
    volumes:
      - radarr-config:/config
      - ${DATA_ROOT}/shared/media:/data/media
      - ${DATA_ROOT}/shared/downloads:/downloads

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - "9696:9696"
    volumes:
      - prowlarr-config:/config

volumes:
  sonarr-config:
    name: sonarr-config
  radarr-config:
    name: radarr-config
  prowlarr-config:
    name: prowlarr-config
