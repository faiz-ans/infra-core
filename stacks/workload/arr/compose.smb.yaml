# Media/downloads via Docker CIFS. /config is local (SQLite must not sit on a network share).
# Use on Docker Desktop when NFS mounts hang/ESTALE. Do not merge with compose.nfs.yaml.
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - "8989:8989"
    volumes:
      - sonarr-config:/config
      - arr-media:/data/media
      - arr-downloads:/downloads

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - "7878:7878"
    volumes:
      - radarr-config:/config
      - arr-media:/data/media
      - arr-downloads:/downloads

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - "9696:9696"
    volumes:
      - prowlarr-config:/config

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info

volumes:
  sonarr-config:
    name: sonarr-config
  radarr-config:
    name: radarr-config
  prowlarr-config:
    name: prowlarr-config
  arr-media:
    driver: local
    driver_opts:
      type: cifs
      o: username=${SMB_USER},password=${SMB_PASSWORD},vers=3.0,noperm,iocharset=utf8,uid=${PUID},gid=${PGID}
      device: "//${NAS_LAN_IP}/shared/media"
  arr-downloads:
    driver: local
    driver_opts:
      type: cifs
      o: username=${SMB_USER},password=${SMB_PASSWORD},vers=3.0,noperm,iocharset=utf8,uid=${PUID},gid=${PGID}
      device: "//${NAS_LAN_IP}/shared/downloads"
