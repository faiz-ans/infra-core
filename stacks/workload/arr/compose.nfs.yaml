# Media/downloads on Docker NFS. /config is a local volume: Sonarr/Radarr/Prowlarr
# use SQLite, which is unusable on NFS (multi-minute starts, WAL/fsync over the LAN).
# Deploy this file instead of compose.yaml (do not merge both).
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - "8989:8989"
    volumes:
      - sonarr-config:/config
      - arr-media:/data/media
      - arr-downloads:/downloads

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - "7878:7878"
    volumes:
      - radarr-config:/config
      - arr-media:/data/media
      - arr-downloads:/downloads

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - "9696:9696"
    volumes:
      - prowlarr-config:/config

volumes:
  # New names so Compose does not reuse the old NFS volumes (arr_* -config).
  sonarr-config:
    name: sonarr-config
  radarr-config:
    name: radarr-config
  prowlarr-config:
    name: prowlarr-config
  arr-media:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_LAN_IP},nfsvers=4,rw,nolock,hard
      device: ":${NFS_EXPORT}/media"
  arr-downloads:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_LAN_IP},nfsvers=4,rw,nolock,hard
      device: ":${NFS_EXPORT}/downloads"
