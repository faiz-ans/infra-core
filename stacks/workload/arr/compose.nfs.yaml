# Docker NFS volume driver. Same tree as compose.yaml; engine mounts OMV itself.
# Deploy this file instead of compose.yaml (do not merge both).
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - "8989:8989"
    volumes:
      - sonarr-config:/config
      - arr-media:/data/media
      - arr-downloads:/downloads

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - "7878:7878"
    volumes:
      - radarr-config:/config
      - arr-media:/data/media
      - arr-downloads:/downloads

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - "9696:9696"
    volumes:
      - prowlarr-config:/config

volumes:
  sonarr-config:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_LAN_IP},nfsvers=4,rw,nolock,hard
      device: ":${NFS_EXPORT}/system/periphery/sonarr"
  radarr-config:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_LAN_IP},nfsvers=4,rw,nolock,hard
      device: ":${NFS_EXPORT}/system/periphery/radarr"
  prowlarr-config:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_LAN_IP},nfsvers=4,rw,nolock,hard
      device: ":${NFS_EXPORT}/system/periphery/prowlarr"
  arr-media:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_LAN_IP},nfsvers=4,rw,nolock,hard
      device: ":${NFS_EXPORT}/shared/media"
  arr-downloads:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_LAN_IP},nfsvers=4,rw,nolock,hard
      device: ":${NFS_EXPORT}/shared/downloads"
