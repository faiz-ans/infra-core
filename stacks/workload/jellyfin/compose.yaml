# Bind mounts via DATA_ROOT (local disk, host NFS, or host SMB/CIFS).
# Docker-engine NFS (no host mount): deploy compose.nfs.yaml instead.
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - "8096:8096"
    volumes:
      - ${DATA_ROOT}/system/periphery/jellyfin:/config
      - ${DATA_ROOT}/shared/media:/data/media
