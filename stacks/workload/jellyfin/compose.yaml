# Household data via DATA_ROOT binds. /config is a local volume (same as compose.nfs.yaml).
# Docker-engine NFS (no host mount): deploy compose.nfs.yaml instead.
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - "8096:8096"
    volumes:
      - jellyfin-config:/config
      - ${DATA_ROOT}/shared/media:/data/media

volumes:
  jellyfin-config:
    name: jellyfin-config
