# Household data via DATA_ROOT binds. /config is a local volume (same as compose.nfs.yaml).
# Docker-engine NFS (no host mount): deploy compose.nfs.yaml instead.
# NVIDIA NVENC: Docker Desktop → Settings → Resources → GPU, then enable
# NVIDIA NVENC under Jellyfin Dashboard → Playback → Transcoding.
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    ports:
      - "8096:8096"
    volumes:
      - jellyfin-config:/config
      - ${DATA_ROOT}/shared/media:/data/media
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  jellyfin-config:
    name: jellyfin-config
