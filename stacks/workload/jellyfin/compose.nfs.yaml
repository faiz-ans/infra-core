# Media on Docker NFS. /config is local so the app can start if Core/NFS is down.
# Deploy this file instead of compose.yaml (do not merge both).
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - "8096:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-media:/data/media

volumes:
  # New name so Compose does not reuse the old NFS volume (jellyfin_jellyfin-config).
  jellyfin-config:
    name: jellyfin-config
  jellyfin-media:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_LAN_IP},nfsvers=4,rw,nolock,hard
      device: ":${NFS_EXPORT}/media"
