# Immich on local/host DATA_ROOT binds. Postgres, Redis, ML, and upload are local volumes.
# Deploy this file instead of compose.nfs.yaml (do not merge both).
# Gallery only: External Libraries at /mnt/photos and /mnt/users/<user>/photos.
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      DB_HOSTNAME: database
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      # Docker Desktop DNS is not Pi-hole; Caddy uses tls internal.
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    extra_hosts:
      - "auth.${DOMAIN}:${NAS_LAN_IP}"
    ports:
      - "2283:2283"
    volumes:
      - immich-upload:/data
      - ${DATA_ROOT}/shared/photos:/mnt/photos
      - ${DATA_ROOT}/users:/mnt/users

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-ml
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - immich-ml-cache:/cache

  redis:
    image: docker.io/valkey/valkey:9
    container_name: immich-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - immich-postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  immich-upload:
    name: immich-upload
  immich-postgres:
    name: immich-postgres
  immich-ml-cache:
    name: immich-ml-cache
