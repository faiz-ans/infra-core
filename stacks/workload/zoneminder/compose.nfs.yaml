# ZoneMinder events on Docker NFS. MariaDB, config, and logs are local volumes
# (survives Core down for the DB; live capture still needs NFS for /data).
# Deploy this file instead of compose.yaml (do not merge both).
services:
  db:
    image: mariadb:11
    container_name: zoneminder-db
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MYSQL_DATABASE: zm
      MYSQL_USER: zmuser
      MYSQL_PASSWORD: ${ZM_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${ZM_DB_PASSWORD}
    volumes:
      - zoneminder-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  zoneminder:
    image: ghcr.io/zoneminder-containers/zoneminder-base:latest
    container_name: zoneminder
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      MYSQL_HOST: db
      MYSQL_DATABASE: zm
      MYSQL_USER: zmuser
      MYSQL_PASSWORD: ${ZM_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${ZM_DB_PASSWORD}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - "8084:80"
    # Docker Desktop WSL2: 1G shm plus a 2G cap still OOMs Immich/Jellyfin and
    # drops Periphery. Keep both small. Raise only after the UI stays up.
    mem_limit: 768m
    volumes:
      - zoneminder-events:/data
      - zoneminder-config:/config
      - zoneminder-log:/log
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 268435456

volumes:
  zoneminder-db:
    name: zoneminder-db
  zoneminder-config:
    name: zoneminder-config
  zoneminder-log:
    name: zoneminder-log
  zoneminder-events:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_LAN_IP},nfsvers=4,rw,nolock,hard
      device: ":${NFS_EXPORT}/cameras"
