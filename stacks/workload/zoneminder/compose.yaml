# ZoneMinder on local/host DATA_ROOT binds. MariaDB, config, and logs are local
# volumes. Event recordings are ${DATA_ROOT}/shared/cameras.
# Deploy this file instead of compose.nfs.yaml (do not merge both).
services:
  db:
    image: mariadb:11
    container_name: zoneminder-db
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MYSQL_DATABASE: zm
      MYSQL_USER: zmuser
      MYSQL_PASSWORD: ${ZM_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${ZM_DB_PASSWORD}
    volumes:
      - zoneminder-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  zoneminder:
    image: ghcr.io/zoneminder-containers/zoneminder-base:latest
    container_name: zoneminder
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      MYSQL_HOST: db
      MYSQL_DATABASE: zm
      MYSQL_USER: zmuser
      MYSQL_PASSWORD: ${ZM_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${ZM_DB_PASSWORD}
      PUID: ${PUID}
      PGID: ${PGID}
    ports:
      - "8084:80"
    volumes:
      - ${DATA_ROOT}/shared/cameras:/data
      - zoneminder-config:/config
      - zoneminder-log:/log
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 1000000000

volumes:
  zoneminder-db:
    name: zoneminder-db
  zoneminder-config:
    name: zoneminder-config
  zoneminder-log:
    name: zoneminder-log
