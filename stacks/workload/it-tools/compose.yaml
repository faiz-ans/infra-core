# IT Tools on Core. Stateless browser utilities. Caddy on edge.
services:
  it-tools:
    image: ghcr.io/corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge
