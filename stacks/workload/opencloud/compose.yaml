# OpenCloud on Core. PosixFS root is system/opencloud/posix (indexes, uploads).
# Personal space = users/<username> under that root, via one bind of
# ${DATA_ROOT}/users → /posix/users. Do not mount users/ as POSIX_ROOT:
# uploads/ then sits next to homes and CreateStorageSpace fails with
# "node.Xattrs /posix/uploads: no data available".
# shared/files and shared/photos stay SMB / Immich NFS, not OpenCloud Spaces.
services:
  radicale:
    # Official overlay: https://github.com/opencloud-eu/opencloud-compose/blob/main/radicale/radicale.yml
    # Docs: https://docs.opencloud.eu/docs/admin/configuration/radicale-integration/
    image: opencloudeu/radicale:latest
    container_name: radicale
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    logging:
      driver: local
    volumes:
      - ./config/radicale/config:/etc/radicale/config
      - ${DATA_ROOT}/system/opencloud/radicale:/var/lib/radicale
    networks:
      - edge

  opencloud:
    image: opencloudeu/opencloud-rolling:latest
    container_name: opencloud
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    entrypoint: ["/bin/sh"]
    command: ["-c", "opencloud init || true; opencloud server"]
    extra_hosts:
      - "cloud.${DOMAIN}:${NAS_LAN_IP}"
      - "office.${DOMAIN}:${NAS_LAN_IP}"
      - "auth.${DOMAIN}:${NAS_LAN_IP}"
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      PROXY_HTTP_ADDR: "0.0.0.0:9200"
      PROXY_TLS: "false"
      OC_INSECURE: "true"
      PROXY_ENABLE_BASIC_AUTH: "true"
      IDM_CREATE_DEMO_USERS: "false"
      IDM_ADMIN_PASSWORD: ${OPENCLOUD_ADMIN_PASSWORD}
      OC_URL: https://cloud.${DOMAIN}
      OC_DOMAIN: cloud.${DOMAIN}
      IDP_DOMAIN: auth.${DOMAIN}
      OC_OIDC_ISSUER: https://auth.${DOMAIN}
      WEB_OIDC_CLIENT_ID: opencloud
      WEB_OIDC_SCOPE: openid profile email groups offline_access
      PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD: jwt
      PROXY_OIDC_REWRITE_WELLKNOWN: "true"
      PROXY_AUTOPROVISION_ACCOUNTS: "true"
      PROXY_AUTOPROVISION_CLAIM_USERNAME: preferred_username
      PROXY_AUTOPROVISION_CLAIM_EMAIL: email
      PROXY_AUTOPROVISION_CLAIM_DISPLAYNAME: name
      PROXY_AUTOPROVISION_CLAIM_GROUPS: groups
      WEBFINGER_WEB_OIDC_CLIENT_ID: opencloud
      WEBFINGER_WEB_OIDC_CLIENT_SCOPES: openid profile email groups offline_access
      WEBFINGER_ANDROID_OIDC_CLIENT_ID: opencloud-android
      WEBFINGER_ANDROID_OIDC_CLIENT_SCOPES: openid profile email groups offline_access
      WEBFINGER_IOS_OIDC_CLIENT_ID: opencloud-ios
      WEBFINGER_IOS_OIDC_CLIENT_SCOPES: openid profile email groups offline_access
      WEBFINGER_DESKTOP_OIDC_CLIENT_ID: opencloud-desktop
      WEBFINGER_DESKTOP_OIDC_CLIENT_SCOPES: openid profile email groups offline_access
      OC_EXCLUDE_RUN_SERVICES: idp
      GRAPH_ASSIGN_DEFAULT_USER_ROLE: "true"
      COLLABORA_DOMAIN: office.${DOMAIN}
      PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/csp.yaml
      OC_ADD_RUN_SERVICES: collaboration
      FRONTEND_APP_HANDLER_SECURE_VIEW_APP_ADDR: eu.opencloud.api.collaboration
      COLLABORATION_WOPI_SRC: https://cloud.${DOMAIN}
      COLLABORATION_APP_NAME: CollaboraOnline
      COLLABORATION_APP_PRODUCT: Collabora
      COLLABORATION_APP_ADDR: https://office.${DOMAIN}
      COLLABORATION_APP_ICON: https://office.${DOMAIN}/favicon.ico
      COLLABORATION_APP_INSECURE: "true"
      COLLABORATION_CS3API_DATAGATEWAY_INSECURE: "true"
      # CODE 26 distroless does not generate /etc/coolwsd/proof_key. CheckFileInfo
      # then arrives with empty X-WOPI-Proof / TimeStamp and collaboration returns
      # 500 "ProofKeys verification failed" / "Invalid timestamp".
      COLLABORATION_APP_PROOF_DISABLE: "true"
      STORAGE_USERS_DRIVER: posix
      STORAGE_USERS_ID_CACHE_STORE: nats-js-kv
      STORAGE_USERS_POSIX_WATCH_FS: "true"
      STORAGE_USERS_POSIX_ROOT: /posix
      STORAGE_USERS_POSIX_PERSONAL_SPACE_PATH_TEMPLATE: "users/{{.User.Username}}"
      STORAGE_USERS_POSIX_GENERAL_SPACE_PATH_TEMPLATE: "projects/{{.SpaceId}}"
    volumes:
      - ${DATA_ROOT}/system/opencloud/config:/etc/opencloud
      - ./csp.yaml:/etc/opencloud/csp.yaml:ro
      - ./config/opencloud/proxy.yaml:/etc/opencloud/proxy.yaml
      - ${DATA_ROOT}/system/opencloud/data:/var/lib/opencloud
      - ${DATA_ROOT}/system/opencloud/posix:/posix
      - ${DATA_ROOT}/users:/posix/users
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge
