# Downloads/media via Docker CIFS. /config is local.
# Use on Docker Desktop when NFS mounts hang/ESTALE. Do not merge with compose.nfs.yaml.
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      WEBUI_PORT: "8081"
      TORRENTING_PORT: "6881"
    ports:
      - "8081:8081"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - qbittorrent-config:/config
      - qbittorrent-downloads:/downloads
      - qbittorrent-media:/data/media
      - ./custom-cont-init.d:/custom-cont-init.d:ro

volumes:
  qbittorrent-config:
    name: qbittorrent-config
  qbittorrent-downloads:
    driver: local
    driver_opts:
      type: cifs
      o: username=${SMB_USER},password=${SMB_PASSWORD},vers=3.0,noperm,iocharset=utf8,uid=${PUID},gid=${PGID}
      device: "//${NAS_LAN_IP}/shared/downloads"
  qbittorrent-media:
    driver: local
    driver_opts:
      type: cifs
      o: username=${SMB_USER},password=${SMB_PASSWORD},vers=3.0,noperm,iocharset=utf8,uid=${PUID},gid=${PGID}
      device: "//${NAS_LAN_IP}/shared/media"
