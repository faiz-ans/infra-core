# Docker NFS volume driver. Same tree as compose.yaml; engine mounts OMV itself.
# Deploy this file instead of compose.yaml (do not merge both).
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      WEBUI_PORT: "8081"
      TORRENTING_PORT: "6881"
    ports:
      - "8081:8081"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - qbittorrent-config:/config
      - qbittorrent-downloads:/downloads
      - qbittorrent-media:/data/media
      - ./custom-cont-init.d:/custom-cont-init.d:ro

volumes:
  qbittorrent-config:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_LAN_IP},nfsvers=4,rw,nolock,hard
      device: ":${NFS_EXPORT}/system/periphery/qbittorrent"
  qbittorrent-downloads:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_LAN_IP},nfsvers=4,rw,nolock,hard
      device: ":${NFS_EXPORT}/shared/downloads"
  qbittorrent-media:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_LAN_IP},nfsvers=4,rw,nolock,hard
      device: ":${NFS_EXPORT}/shared/media"
