# Household data via DATA_ROOT binds. /config is a local volume (same as compose.nfs.yaml).
# Docker-engine NFS (no host mount): deploy compose.nfs.yaml instead.
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      WEBUI_PORT: "8081"
      TORRENTING_PORT: "6881"
    ports:
      - "8081:8081"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - qbittorrent-config:/config
      - ${DATA_ROOT}/shared/downloads:/downloads
      - ${DATA_ROOT}/shared/media:/data/media
      - ./custom-cont-init.d:/custom-cont-init.d:ro

volumes:
  qbittorrent-config:
    name: qbittorrent-config
