# Request UI for Jellyfin (Seerr). Config is a local named volume (required on
# Docker Desktop; bind-mounts on Windows corrupt SQLite). The image runs as
# UID 1000. After copying from another volume: chown -R 1000:1000 /app/config.
services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    ports:
      - "5055:5055"
    volumes:
      - seerr-config:/app/config

volumes:
  seerr-config:
    name: seerr-config
