# Scriberr on periphery. SQLite, uploads, and Whisper/Python envs are local
# volumes (models are large; not NFS). Caddy terminates TLS at scribe.${DOMAIN}.
# CUDA image for RTX 20-series (scriberr-cuda). Docker Desktop GPU required.
# First start downloads models and can take several minutes.
# scriberr-cuda ships appuser as 10001 (UID 1000 is ubuntu). Household [[PUID]]
# 1000 makes SQLite "readonly database (8)" on migrate. Do not use [[PUID]] here.
# https://github.com/rishikanthc/Scriberr/issues/370
services:
  scriberr:
    image: ghcr.io/rishikanthc/scriberr-cuda:latest
    pull_policy: missing
    container_name: scriberr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: "10001"
      PGID: "10001"
      APP_ENV: production
      ALLOWED_ORIGINS: https://voice.${DOMAIN},https://scribe.${DOMAIN},https://transcribe.${DOMAIN},https://scriberr.${DOMAIN}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "8085:8080"
    volumes:
      - scriberr-data:/app/data
      - scriberr-whisperx:/app/whisperx-env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-fsS"
        - "-o"
        - "/dev/null"
        - "http://127.0.0.1:8080/"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1800s

volumes:
  scriberr-data:
    name: scriberr-data
  scriberr-whisperx:
    name: scriberr-whisperx
