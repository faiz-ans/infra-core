# GENERATED from topology.inc — do not hand-edit.
# Regenerate: python3 stacks/komodo/generate-stacks.py
#
# Phase A (bootstrap): identity, DNS, edge, OpenCloud (+ Collabora).
# May list stacks on multiple Komodo servers. Apply this ResourceSync path first
# on a greenfield site before stacks-core.toml / stacks-periphery.toml.
# Komodo does not interpolate [[VAR]] in server/repo — those must be literals.
# Environment [[VAR]] still interpolates at deploy from Core [secrets] / Variables.
# webhook_enabled is false; poll on-site.
# Stacks clone GitHub per stack (`repo`). ResourceSync uses topology linked_repo.

[[stack]]
name = "caddy"
deploy = true
[stack.config]
server = "core"
repo = "faiz-ans/infra-core"
branch = "main"
run_directory = "stacks/platform/caddy"
file_paths = ["compose.yaml"]
config_files = [
  { path = "Caddyfile", requires = "Redeploy" },
  { path = "entrypoint.sh", requires = "Redeploy" },
  { path = "export-ca.sh", requires = "Redeploy" },
]
webhook_enabled = false
poll_for_updates = true
environment = """
DOMAIN = [[DOMAIN]]
HTPC_UPSTREAM = [[HTPC_UPSTREAM]]
TZ = [[TZ]]
DATA_ROOT = [[DATA_ROOT]]
"""

[[stack]]
name = "authelia"
deploy = true
after = ["caddy"]
[stack.config]
server = "core"
repo = "faiz-ans/infra-core"
branch = "main"
run_directory = "stacks/platform/authelia"
file_paths = ["compose.yaml"]
config_files = [
  { path = "configuration.yml", requires = "Redeploy" },
]
webhook_enabled = false
poll_for_updates = true
environment = """
DOMAIN = [[DOMAIN]]
TZ = [[TZ]]
DATA_ROOT = [[DATA_ROOT]]
AUTHELIA_JWT_SECRET = [[AUTHELIA_JWT_SECRET]]
AUTHELIA_SESSION_SECRET = [[AUTHELIA_SESSION_SECRET]]
AUTHELIA_STORAGE_ENCRYPTION_KEY = [[AUTHELIA_STORAGE_ENCRYPTION_KEY]]
AUTHELIA_OIDC_HMAC_SECRET = [[AUTHELIA_OIDC_HMAC_SECRET]]
"""

