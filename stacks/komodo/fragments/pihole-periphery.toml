[[stack]]
name = "pihole-periphery"
deploy = false
[stack.config]
server = "periphery"
repo = "faiz-ans/infra-core"
branch = "main"
run_directory = "stacks/platform/pihole"
file_paths = ["compose.periphery.yaml"]
webhook_enabled = false
poll_for_updates = true
environment = """
TZ = [[TZ]]
DOMAIN = [[DOMAIN]]
NAS_LAN_IP = [[NAS_LAN_IP]]
HTPC_UPSTREAM = [[HTPC_UPSTREAM]]
PIHOLE_PERIPHERY_WEBPASSWORD = [[PIHOLE_PERIPHERY_WEBPASSWORD]]
"""

# Read-only Docker API for Homepage. LAN bind only; not in Caddy.
