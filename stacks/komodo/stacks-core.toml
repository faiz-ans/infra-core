# ResourceSync source for the Core host (Komodo Core + local Periphery).
# Komodo does not interpolate [[VAR]] in server/repo — those must be literals.
# Environment [[VAR]] still interpolates at deploy from Core [secrets] / Variables.
# webhook_enabled is false; poll on-site.

[[stack]]
name = "caddy"
deploy = true
[stack.config]
server = "core"
repo = "faiz-ans/infra-core"
branch = "main"
run_directory = "stacks/platform/caddy"
file_paths = ["compose.yaml"]
config_files = [
  { path = "Caddyfile", requires = "Redeploy" },
]
webhook_enabled = false
poll_for_updates = true
environment = """
DOMAIN = [[DOMAIN]]
HTPC_UPSTREAM = [[HTPC_UPSTREAM]]
NAS_LAN_IP = [[NAS_LAN_IP]]
TZ = [[TZ]]
"""

[[stack]]
name = "authelia"
deploy = true
after = ["caddy"]
[stack.config]
server = "core"
repo = "faiz-ans/infra-core"
branch = "main"
run_directory = "stacks/platform/authelia"
file_paths = ["compose.yaml"]
webhook_enabled = false
poll_for_updates = true
environment = """
DOMAIN = [[DOMAIN]]
TZ = [[TZ]]
DATA_ROOT = [[DATA_ROOT]]
AUTHELIA_JWT_SECRET = [[AUTHELIA_JWT_SECRET]]
AUTHELIA_SESSION_SECRET = [[AUTHELIA_SESSION_SECRET]]
AUTHELIA_STORAGE_ENCRYPTION_KEY = [[AUTHELIA_STORAGE_ENCRYPTION_KEY]]
"""

# Name is global across ResourceSync files. The HTPC copy is "pihole-periphery".
[[stack]]
name = "pihole"
deploy = true
after = ["caddy"]
[stack.config]
server = "core"
repo = "faiz-ans/infra-core"
branch = "main"
run_directory = "stacks/platform/pihole"
file_paths = ["compose.yaml"]
webhook_enabled = false
poll_for_updates = true
environment = """
DOMAIN = [[DOMAIN]]
NAS_LAN_IP = [[NAS_LAN_IP]]
TZ = [[TZ]]
DATA_ROOT = [[DATA_ROOT]]
"""

[[stack]]
name = "wireguard"
deploy = true
after = ["caddy"]
[stack.config]
server = "core"
repo = "faiz-ans/infra-core"
branch = "main"
run_directory = "stacks/platform/wireguard"
file_paths = ["compose.yaml"]
config_files = [
  { path = "entrypoint.sh", requires = "Redeploy" },
]
webhook_enabled = false
poll_for_updates = true
environment = """
DOMAIN = [[DOMAIN]]
NAS_LAN_IP = [[NAS_LAN_IP]]
TZ = [[TZ]]
DATA_ROOT = [[DATA_ROOT]]
WG_HOST = [[WG_HOST]]
WG_UI_PASSWORD = [[WG_UI_PASSWORD]]
"""

[[stack]]
name = "homepage"
deploy = true
after = ["caddy", "authelia"]
[stack.config]
server = "core"
repo = "faiz-ans/infra-core"
branch = "main"
run_directory = "stacks/platform/homepage"
file_paths = ["compose.yaml"]
config_files = [
  { path = "config/services.yaml", requires = "Redeploy" },
  { path = "config/settings.yaml", requires = "Redeploy" },
]
webhook_enabled = false
poll_for_updates = true
environment = """
DOMAIN = [[DOMAIN]]
TZ = [[TZ]]
DATA_ROOT = [[DATA_ROOT]]
HOMEPAGE_VAR_DOMAIN = [[DOMAIN]]
HOMEPAGE_VAR_HTPC_UPSTREAM = [[HTPC_UPSTREAM]]
HOMEPAGE_VAR_NAS_LAN_IP = [[NAS_LAN_IP]]
HOMEPAGE_VAR_PIHOLE_TOKEN = [[HOMEPAGE_VAR_PIHOLE_TOKEN]]
HOMEPAGE_VAR_JELLYFIN_KEY = [[HOMEPAGE_VAR_JELLYFIN_KEY]]
HOMEPAGE_VAR_SONARR_KEY = [[HOMEPAGE_VAR_SONARR_KEY]]
HOMEPAGE_VAR_RADARR_KEY = [[HOMEPAGE_VAR_RADARR_KEY]]
HOMEPAGE_VAR_PROWLARR_KEY = [[HOMEPAGE_VAR_PROWLARR_KEY]]
HOMEPAGE_VAR_QBIT_USERNAME = [[HOMEPAGE_VAR_QBIT_USERNAME]]
HOMEPAGE_VAR_QBIT_PASSWORD = [[HOMEPAGE_VAR_QBIT_PASSWORD]]
HOMEPAGE_VAR_GRAFANA_KEY = [[HOMEPAGE_VAR_GRAFANA_KEY]]
HOMEPAGE_VAR_WGEASY_PASSWORD = [[HOMEPAGE_VAR_WGEASY_PASSWORD]]
HOMEPAGE_ALLOWED_HOSTS = dash.[[DOMAIN]]
"""

[[stack]]
name = "vaultwarden"
deploy = true
after = ["caddy", "authelia"]
[stack.config]
server = "core"
repo = "faiz-ans/infra-core"
branch = "main"
run_directory = "stacks/workload/vaultwarden"
file_paths = ["compose.yaml"]
webhook_enabled = false
poll_for_updates = true
environment = """
DOMAIN = [[DOMAIN]]
TZ = [[TZ]]
DATA_ROOT = [[DATA_ROOT]]
VAULTWARDEN_ADMIN_TOKEN = [[VAULTWARDEN_ADMIN_TOKEN]]
SIGNUPS_ALLOWED = [[SIGNUPS_ALLOWED]]
"""

# Off until restic-rest is on the IronWolf. Applying this now would crash-loop against :8000.
[[stack]]
name = "restic"
deploy = false
after = ["vaultwarden"]
[stack.config]
server = "core"
repo = "faiz-ans/infra-core"
branch = "main"
run_directory = "stacks/platform/restic"
file_paths = ["compose.yaml"]
webhook_enabled = false
poll_for_updates = true
environment = """
TZ = [[TZ]]
DATA_ROOT = [[DATA_ROOT]]
HTPC_UPSTREAM = [[HTPC_UPSTREAM]]
RESTIC_PASSWORD = [[RESTIC_PASSWORD]]
RESTIC_REST_USER = [[RESTIC_REST_USER]]
RESTIC_REST_PASSWORD = [[RESTIC_REST_PASSWORD]]
"""
