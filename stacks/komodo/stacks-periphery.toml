# ResourceSync source for the remote Periphery host.
# Komodo does not interpolate [[VAR]] in server/repo — those must be literals.
# Apply this file only after the periphery server is connected.
# deploy = false: ResourceSync must NOT mass-start HTPC stacks (Docker Desktop
# wedges if every compose pulls/mounts at once). Deploy one stack at a time in the UI.
# webhook_enabled is false; poll on-site.
# repo path stays faiz-ans/infra-core. After Gitea is up, the same Komodo git
# provider (gitea:3000) is used here; GitHub is a push mirror.
# Storage: /config is always a local volume. Household data is either
# compose.yaml + DATA_ROOT binds, compose.nfs.yaml (Linux NFS), or compose.smb.yaml
# (Docker Desktop CIFS — this site). Do not list two transport files.
# Docker Desktop: run bootstrap/periphery-docker-engine.ps1 (or merge
# windows/docker-engine.json) before applying this file. Factory 172.18–172.31
# /16 pools then overlap the LAN and Periphery loses Core (bootstrap/periphery.md §1).

# compose.smb.yaml: media on OMV SMB; /config is local (survives Core down).
[[stack]]
name = "jellyfin"
deploy = false
[stack.config]
server = "periphery"
repo = "faiz-ans/infra-core"
branch = "main"
run_directory = "stacks/workload/jellyfin"
file_paths = ["compose.smb.yaml"]
webhook_enabled = false
poll_for_updates = true
environment = """
TZ = [[TZ]]
PUID = [[PUID]]
PGID = [[PGID]]
NAS_LAN_IP = [[NAS_LAN_IP]]
SMB_USER = [[SMB_USER]]
SMB_PASSWORD = [[SMB_PASSWORD]]
"""

