# ResourceSync source for the remote Periphery host.
# server name is [[PERIPHERY_SERVER]] (bootstrap default: periphery).
# webhook_enabled is false; poll on-site.

[[stack]]
name = "jellyfin"
deploy = true
[stack.config]
server = "[[PERIPHERY_SERVER]]"
repo = "[[CATALOG_REPO]]"
branch = "main"
run_directory = "stacks/workload/jellyfin"
file_paths = ["compose.yaml"]
webhook_enabled = false
poll_for_updates = true
environment = """
TZ = [[TZ]]
PUID = [[PUID]]
PGID = [[PGID]]
DATA_ROOT = [[DATA_ROOT]]
"""

