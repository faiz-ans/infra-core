# ResourceSync source for the remote Periphery host.
# Komodo does not interpolate [[VAR]] in server/repo — those must be literals.
# Apply this file only after the periphery server is connected.
# webhook_enabled is false; poll on-site.
# repo path stays faiz-ans/infra-core. After Gitea is up, the same Komodo git
# provider (gitea:3000) is used here; GitHub is a push mirror.
# Storage: /config is always a local volume. Household data is either
# compose.yaml + DATA_ROOT binds, or compose.nfs.yaml + NAS_LAN_IP + NFS_EXPORT (+ NFS_USERS for Nextcloud).
# Do not list both files.

# compose.nfs.yaml: media on NFS; /config is local (survives Core down).
[[stack]]
name = "jellyfin"
deploy = true
[stack.config]
server = "periphery"
repo = "faiz-ans/infra-core"
branch = "main"
run_directory = "stacks/workload/jellyfin"
file_paths = ["compose.nfs.yaml"]
webhook_enabled = false
poll_for_updates = true
environment = """
TZ = [[TZ]]
PUID = [[PUID]]
PGID = [[PGID]]
NAS_LAN_IP = [[NAS_LAN_IP]]
NFS_EXPORT = [[NFS_EXPORT]]
"""

