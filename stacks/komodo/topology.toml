# Site topology — source of truth for ResourceSync TOML generation.
# Edit this file, then: python3 stacks/komodo/generate-stacks.py
# Do not hand-edit generated stacks-*.toml (they will be overwritten).
#
# Multi-periphery Caddy upstream / NFS rewiring is deferred; schema allows
# additional server names, but this reference site stays core + periphery.

servers = ["core", "periphery"]
repo = "faiz-ans/infra-core"
branch = "main"
# Komodo Repo resource name (ResourceSync Select Repo). Stacks clone GitHub
# themselves via fragment `repo`.
linked_repo = "infra-core"

# phase: bootstrap → stacks-bootstrap.toml (mixed servers OK)
# phase: full → stacks-<server>.toml
# enabled = false → omitted from all generated files

[stacks.caddy]
server = "core"
phase = "bootstrap"

[stacks.authelia]
server = "core"
phase = "bootstrap"

