---
# When OpenCloud is placed: posix layout, ACL/sticky, do not recreate spaces if xattrs exist.
- name: OpenCloud on this host
  set_fact:
    site_oc: "{{ site_plan.services | selectattr('host', 'equalto', site_host_name) | selectattr('key', 'equalto', 'opencloud') | list }}"

- name: Skip
  meta: end_host
  when: site_oc | length == 0

- name: Workload user
  set_fact:
    site_wl_user: "{{ (site_oc | first).user | default('') }}"

- name: Sablier on this OpenCloud user
  set_fact:
    site_oc_sablier: >-
      {{
        site_plan.services
        | selectattr('key', 'equalto', 'sablier')
        | selectattr('host', 'equalto', site_host_name)
        | selectattr('user', 'defined')
        | selectattr('user', 'equalto', site_wl_user)
        | list
      }}

- name: Workload uid
  command: id -u {{ site_wl_user }}
  register: site_oc_uid
  changed_when: false

- name: OpenCloud host dirs
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ site_wl_user }}"
    mode: "0750"
  loop:
    - "{{ site_plan.roots.appdata }}/opencloud"
    - "{{ site_plan.roots.appdata }}/opencloud/data"
    - "{{ site_plan.roots.appdata }}/opencloud/projects"

- name: OpenCloud files belong to the workload user
  file:
    path: "{{ site_plan.roots.appdata }}/opencloud"
    state: directory
    owner: "{{ site_wl_user }}"
    recurse: true

# Posix node locks live on the home, not under appdata. They are created
# 0600 by whoever ran the container. A later workload user cannot open them,
# and the space disappears from the list.
- name: OpenCloud node metadata belongs to the workload user
  shell: |
    set -euo pipefail
    wl="{{ site_wl_user }}"
    [[ -n "$wl" ]] || exit 0
    for root in "{{ site_plan.roots.users }}" "{{ site_plan.roots.groups }}"; do
      [[ -d "$root" ]] || continue
      find "$root" -mindepth 2 -maxdepth 2 \( -name .oc-nodes -o -name .oc-tmp -o -name .space \) -type d -print0 |
        while IFS= read -r -d '' dir; do
          if find "$dir" ! -user "$wl" -print -quit | grep -q .; then
            chown -R "$wl" -- "$dir"
            printf 'owned %s\n' "$dir"
          fi
        done
    done
  args:
    executable: /bin/bash
  register: site_oc_nodes
  changed_when: "'owned ' in (site_oc_nodes.stdout | default(''))"

- name: Reopen OpenCloud after node metadata changes owner
  become_user: "{{ site_wl_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ site_oc_uid.stdout }}"
  shell: |
    set -euo pipefail
    systemctl --user is-active --quiet opencloud.service || exit 0
    systemctl --user restart opencloud.service
    {% if site_oc_sablier | length > 0 %}
    curl -fsS --max-time 180 "http://127.0.0.1:10000/api/strategies/blocking?names=opencloud.service" -o /dev/null
    {% endif %}
  args:
    executable: /bin/bash
  when: "'owned ' in (site_oc_nodes.stdout | default(''))"

- name: OpenCloud config dir is traversable so nested file mounts can be created
  file:
    path: "{{ site_plan.roots.appdata }}/opencloud/config"
    state: directory
    owner: "{{ site_wl_user }}"
    mode: "0755"

- name: OpenCloud nested file mount points
  file:
    path: "{{ item }}"
    state: touch
    owner: "{{ site_wl_user }}"
    mode: "0644"
  loop:
    - "{{ site_plan.roots.appdata }}/opencloud/config/csp.yaml"
    - "{{ site_plan.roots.appdata }}/opencloud/config/proxy.yaml"

- name: OpenCloud posix parent is traversable by the runtime that creates nested mounts
  file:
    path: "{{ site_plan.roots.appdata }}/opencloud/posix"
    state: directory
    owner: "{{ site_wl_user }}"
    mode: "0755"

- name: OpenCloud nested mount points inside posix
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ site_wl_user }}"
    mode: "0755"
  loop:
    - "{{ site_plan.roots.appdata }}/opencloud/posix/users"
    - "{{ site_plan.roots.appdata }}/opencloud/posix/projects"
    - "{{ site_plan.roots.appdata }}/opencloud/posix/groups"

- name: Users root stays traversable
  file:
    path: "{{ site_plan.roots.users }}"
    state: directory
    mode: "2775"

- name: Detect existing space xattrs
  command: getfattr -n user.oc.space.id --only-values "{{ site_plan.roots.users }}"
  register: site_oc_xattr
  changed_when: false
  failed_when: false

- name: Leave existing spaces in place
  debug:
    msg: "OpenCloud xattrs present; not recreating spaces"
  when: site_oc_xattr.rc == 0
