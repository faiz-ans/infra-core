---
# People access via SMB. No OMV packages.
- name: Owns people roots?
  set_fact:
    site_owns_people: >-
      {{
        (site_plan.owners.groups.host | default('') == site_host_name)
        or (site_plan.owners.users.host | default('') == site_host_name)
      }}

- name: Skip
  meta: end_host
  when: not site_owns_people or site_plan.policy.filesystem != 'smb'

- name: Samba packages
  apt:
    name:
      - samba
    state: present

- name: Samba site config
  copy:
    dest: /etc/samba/smb.conf
    mode: "0644"
    content: |
      [global]
      workgroup = SITE
      server role = standalone server
      map to guest = never
      obey pam restrictions = no
      unix extensions = no
      ea support = yes
      vfs objects = fruit streams_xattr
      fruit:metadata = stream

      [users]
      path = {{ site_plan.roots.users }}
      browseable = yes
      read only = no
      valid users = @all
      inherit acls = yes
      smb3 unix extensions = no
      force group = root
      create mask = 0660
      directory mask = 0770
      force create mode = 0660
      force directory mode = 2770

      [groups]
      path = {{ site_plan.roots.groups }}
      browseable = yes
      read only = no
      valid users = @all
      inherit acls = yes
      smb3 unix extensions = no
      create mask = 0660
      directory mask = 2770
      force create mode = 0660
      force directory mode = 2770
  notify: restart smbd

- name: Enable smbd
  service:
    name: smbd
    enabled: true
    state: started

- name: Disjoint SMB passwords
  include_role:
    name: directory
    tasks_from: smb_local.yml
  when:
    - site_plan.ldap != 'openldap'
    - (site_delta.sections.users | default(true) | bool) or (site_delta.sections.secrets | default(false) | bool)
