# Read access for whoever opens the source. On the backup host that is the
# engine user. On an export host it is the NFS squash user.
# setfacl -m, not only the default ACL: a mode 0600 create or chmod clears
# the mask, which leaves a named user entry with no effect. Caddy's local
# certificates are mode 0600 and renew in the half hour after 02:30, so the
# 02:30 sweep is not the last word. `repair` fixes those masks again, and
# the backup controller runs it in the minute before a job and before a
# browser backup. This does not replace existing access entries.
- name: Backup grants on this host
  set_fact:
    site_backup_grants: "{{ site_plan.backup_grants | default([]) | selectattr('host', 'equalto', site_host_name) | list }}"

- name: ACL tools for backup reads
  apt:
    name: acl
    state: present
  when: site_backup_grants | length > 0

- name: Read-only access for the backup user
  shell: |
    set -euo pipefail
    path="{{ item.path }}"
    user="{{ item.user }}"
    if [ ! -e "$path" ]; then
      echo "backup source $path is missing" >&2
      exit 1
    fi
    setfacl -R -m "u:${user}:rX" "$path"
    setfacl -R -d -m "u:${user}:rX" "$path"
  loop: "{{ site_backup_grants }}"
  when: site_backup_grants | length > 0

- name: Backup ACL refresh list
  copy:
    dest: /etc/site-backup-acl.grants
    mode: "0644"
    content: |
      {% for grant in site_backup_grants %}
      {{ grant.user }} {{ grant.path }}
      {% endfor %}
  when: site_backup_grants | length > 0

- name: Backup ACL refresh script
  copy:
    dest: /usr/local/sbin/site-backup-acl
    mode: "0755"
    content: |
      #!/bin/sh
      set -eu
      [ -s /etc/site-backup-acl.grants ] || exit 0
      mode=${1:-sweep}
      while read -r user path; do
        [ -n "$user" ] || continue
        [ -e "$path" ] || continue
        if [ "$mode" = "repair" ]; then
          # Mode 0600 clears the ACL mask. Caddy rewrites these paths that
          # way when it renews a local certificate; the Authelia key is
          # chmod 0600. The rest of the tree is the 02:30 sweep.
          for rel in caddy/data/caddy/certificates caddy/data/caddy/pki authelia/oidc.pem; do
            target="${path}/${rel}"
            if [ -d "$target" ]; then
              find "$target" -xdev \( -type f -perm 600 -o -type d -perm 700 \) -exec setfacl -m "u:${user}:rX" {} +
            elif [ -f "$target" ]; then
              setfacl -m "u:${user}:rX" "$target"
            fi
          done
          continue
        fi
        setfacl -R -m "u:${user}:rX" "$path"
        setfacl -R -d -m "u:${user}:rX" "$path"
      done < /etc/site-backup-acl.grants
  when: site_backup_grants | length > 0

- name: Backup ACL refresh service
  copy:
    dest: /etc/systemd/system/site-backup-acl.service
    mode: "0644"
    content: |
      [Unit]
      Description=Refresh read access for backup sources

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/site-backup-acl
  when: site_backup_grants | length > 0

- name: Backup ACL refresh timer
  copy:
    dest: /etc/systemd/system/site-backup-acl.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Refresh backup read access before the daily backup

      [Timer]
      OnCalendar=02:30
      Persistent=false

      [Install]
      WantedBy=timers.target
  when: site_backup_grants | length > 0

- name: Enable the backup ACL refresh
  systemd:
    name: site-backup-acl.timer
    enabled: true
    state: started
    daemon_reload: true
  when: site_backup_grants | length > 0

- name: Backup user may refresh read access
  copy:
    dest: /etc/sudoers.d/site-backup-acl
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      {% for user in site_backup_grants | map(attribute='user') | unique %}
      {{ user }} ALL=(root) NOPASSWD: /usr/local/sbin/site-backup-acl
      {% endfor %}
  when: site_backup_grants | length > 0
