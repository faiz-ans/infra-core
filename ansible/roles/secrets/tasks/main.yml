---
- name: Read decrypted secrets from runner
  slurp:
    src: "{{ site_repo }}/ansible/.tmp/secrets.json"
  register: site_secrets_b64
  delegate_to: localhost
  become: false

- name: Parse secrets
  set_fact:
    site_secrets: "{{ site_secrets_b64.content | b64decode | from_json }}"

- name: This host workload user
  set_fact:
    site_wl_user: "{{ (site_plan.hosts | selectattr('name', 'equalto', site_host_name) | list | first).roles.workload.user | default('') }}"

- name: Install Podman secrets (rootless)
  become: true
  become_user: "{{ site_wl_user }}"
  shell: |
    printf '%s' '{{ item.value }}' | podman secret create --replace {{ item.name }} -
  loop: "{{ site_secrets }}"
  no_log: true
  when: site_wl_user | length > 0
