---
- name: Read decrypted secrets from runner
  slurp:
    src: "{{ site_repo }}/ansible/.tmp/secrets.json"
  register: site_secrets_b64
  delegate_to: localhost
  become: false

- name: Parse secrets
  set_fact:
    site_secrets: "{{ site_secrets_b64.content | b64decode | from_json }}"

- name: Install Podman secrets (rootless)
  become: true
  become_user: "{{ item.user }}"
  shell: |
    {% if item.kube | default(false) %}
    printf '%s' '{{ item.value }}' | python3 -c 'import base64,json,sys; raw=sys.stdin.buffer.read(); sys.stdout.write(json.dumps({"apiVersion":"v1","kind":"Secret","metadata":{"name":sys.argv[1]},"type":"Opaque","data":{"value":base64.b64encode(raw).decode()}}))' {{ item.name }} | podman secret create --replace {{ item.name }} -
    {% else %}
    printf '%s' '{{ item.value }}' | podman secret create --replace {{ item.name }} -
    {% endif %}
  loop: "{{ site_secrets }}"
  no_log: true
  when:
    - item.user | default('') | length > 0
    - (item.host | default('')) == '' or (item.host | default('')) == site_host_name

- name: Install Podman secrets for rootful units
  become: true
  shell: |
    {% if item.kube | default(false) %}
    printf '%s' '{{ item.value }}' | python3 -c 'import base64,json,sys; raw=sys.stdin.buffer.read(); sys.stdout.write(json.dumps({"apiVersion":"v1","kind":"Secret","metadata":{"name":sys.argv[1]},"type":"Opaque","data":{"value":base64.b64encode(raw).decode()}}))' {{ item.name }} | podman secret create --replace {{ item.name }} -
    {% else %}
    printf '%s' '{{ item.value }}' | podman secret create --replace {{ item.name }} -
    {% endif %}
  loop: "{{ site_secrets }}"
  no_log: true
  when: site_host_name in (item.root_hosts | default([]))
