---
# Disjoint SMB accounts when LDAP is not the source of truth.
- name: Render SMB passwords
  command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/render_directory.py"
      - "{{ desired_path }}"
      - "{{ secrets_file }}"
      - "{{ site_repo }}/ansible/.tmp/directory"
      - "{{ site_host_name }}"
      - --accounts-only
  delegate_to: localhost
  become: false
  changed_when: false

- name: Install disjoint SMB passwords
  include_tasks: smbpasswd.yml
