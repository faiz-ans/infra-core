---
# Cockpit is a host package. hosts[].admin-gui defaults to disabled.
- name: This host
  set_fact:
    site_this_host: "{{ site_plan.hosts | selectattr('name', 'equalto', site_host_name) | list | first }}"

- name: Admin GUI config
  set_fact:
    site_admin_gui: "{{ site_this_host['admin-gui'] | default({'enabled': false, 'primary': 'cockpit', 'aliases': []}) }}"

- name: Admin GUI public labels
  set_fact:
    site_admin_gui_labels: "{{ ([site_admin_gui.primary] + (site_admin_gui.aliases | default([]))) | unique | list }}"

- name: Install Cockpit
  apt:
    name:
      - cockpit
      - cockpit-podman
      - cockpit-networkmanager
    state: present
  when: site_admin_gui.enabled | bool

- name: Cockpit accepts its public names
  copy:
    dest: /etc/cockpit/cockpit.conf
    mode: "0644"
    content: |
      [WebService]
      Origins = {% for label in site_admin_gui_labels %}https://{{ label }}.{{ site_plan.domain }} wss://{{ label }}.{{ site_plan.domain }}{% if not loop.last %} {% endif %}{% endfor %}

      ProtocolHeader = X-Forwarded-Proto
  when: site_admin_gui.enabled | bool
  notify: restart cockpit

- name: Enable Cockpit
  service:
    name: cockpit.socket
    enabled: true
    state: started
  when: site_admin_gui.enabled | bool

- name: Remove Cockpit public-name config
  file:
    path: /etc/cockpit/cockpit.conf
    state: absent
  when: not (site_admin_gui.enabled | bool)

- name: Stop Cockpit
  service:
    name: cockpit.socket
    enabled: false
    state: stopped
  failed_when: false
  when: not (site_admin_gui.enabled | bool)

- name: Remove Cockpit
  apt:
    name:
      - cockpit
      - cockpit-podman
      - cockpit-networkmanager
    state: absent
  when: not (site_admin_gui.enabled | bool)
