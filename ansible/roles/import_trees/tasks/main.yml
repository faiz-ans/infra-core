---
# Typed imports: roots merge into site roots; homes land under their root (as: relocates).
# from: is relative to the source disk mount. Stamp success. Generated files land as *.old.
- name: Host import blocks
  set_fact:
    site_imports: "{{ site_plan.imports | default([]) | selectattr('host', 'equalto', site_host_name) | list }}"
  when: site_plan is defined

- name: Skip when no imports
  meta: end_host
  when: site_imports | default([]) | length == 0

- name: Stamp directories
  file:
    path: "{{ item.stamp | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ site_imports }}"
  when: item.stamp | length > 0

- name: Create dest homes and merge targets
  file:
    path: "{{ item.to }}"
    state: directory
    mode: "0755"
  loop: "{{ site_imports }}"
  when:
    - not item.same_place | default(false)
    - not item.generated | default(false)

- name: Copy import tree unless stamped or already in place
  command:
    argv:
      - rsync
      - -a
      - "{{ item.from }}/"
      - "{{ item.to }}/"
    creates: "{{ item.stamp }}"
  loop: "{{ site_imports }}"
  when:
    - not item.same_place | default(false)
    - not item.generated | default(false)

- name: Import generated files as .old
  copy:
    src: "{{ item.from }}"
    dest: "{{ item.to }}.old"
    remote_src: true
    force: false
  loop: "{{ site_imports }}"
  when: item.generated | default(false)

- name: Stamp successful import
  copy:
    dest: "{{ item.stamp }}"
    content: "ok\n"
    mode: "0644"
  loop: "{{ site_imports }}"
