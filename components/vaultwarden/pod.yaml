apiVersion: v1
kind: Pod
metadata:
  name: vaultwarden
  labels:
    app: vaultwarden
spec:
  restartPolicy: Always
  containers:
  - name: vaultwarden
    image: docker.io/vaultwarden/server:latest
    imagePullPolicy: Always
    env:
    - name: TZ
      value: "${TZ}"
    - name: DOMAIN
      value: "https://pw.${DOMAIN}"
    - name: ADMIN_TOKEN
      value: "${VAULTWARDEN_ADMIN_TOKEN}"
    - name: SIGNUPS_ALLOWED
      value: "${SIGNUPS_ALLOWED}"
    - name: WEBSOCKET_ENABLED
      value: "true"
    ports:
    - containerPort: 80
    volumeMounts:
    - name: data
      mountPath: /data

  volumes:
  - name: data
    hostPath:
      path: ${DATA_ROOT}/system/vaultwarden
