apiVersion: v1
kind: Pod
metadata:
  name: bentopdf
  labels:
    app: bentopdf
spec:
  restartPolicy: Always
  containers:
  - name: bentopdf
    image: ghcr.io/alam00000/bentopdf-simple:latest
    imagePullPolicy: Always
    env:
    - name: TZ
      value: "${site.env.timezone}"
    ports:
    - containerPort: 80

