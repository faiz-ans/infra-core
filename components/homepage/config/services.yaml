- System:

    - Platform:
        - Peanut:
            href: https://ups.{{HOMEPAGE_VAR_DOMAIN}}
            icon: peanut.svg
            description: Power
            server: core-pilot
            container: peanut
            widget:
                type: peanut
                # pasta host-loopback. IP, not hostname (Node AAAA stall).
                url: http://{{HOMEPAGE_VAR_HOST_LOOPBACK}}:8092
                key: ups 
        - Cockpit:
            href: https://sys.{{HOMEPAGE_VAR_DOMAIN}}
            # Cleartext /ping 301s onto Cockpit's certificate. Homepage follows that and reports 500.
            siteMonitor: https://{{HOMEPAGE_VAR_HOST_LOOPBACK}}:9090/ping
            icon: cockpit.svg
            description: Operations
        - OpenLDAP:
            href: https://users.{{HOMEPAGE_VAR_DOMAIN}}
            icon: openldap.svg
            description: Identity & Access
            server: core-pilot
            container: openldap
        - Authelia:
            href: https://auth.{{HOMEPAGE_VAR_DOMAIN}}
            icon: authelia.svg
            description: Authentication
            server: core-pilot
            container: authelia
        - RustDesk:
            href: https://desk.{{HOMEPAGE_VAR_DOMAIN}}
            icon: rustdesk.png
            description: Remote Desktop
            server: core-hostess
            container: rustdesk-hbbs

    - Network:
        - Pi-hole:
            href: https://dns.{{HOMEPAGE_VAR_DOMAIN}}/admin
            icon: pi-hole.svg
            description: DNS
            server: core-pilot
            container: pi-hole
            widget:
                type: pihole
                url: http://{{HOMEPAGE_VAR_HOST_LOOPBACK}}:{{HOMEPAGE_VAR_PIHOLE_WEB_PORT}}
                version: 6
                key: "{{HOMEPAGE_VAR_PIHOLE_TOKEN}}"
                fields:
                  - queries
                  - blocked_percent
                  - gravity
        - Caddy:
            href: https://ingress.{{HOMEPAGE_VAR_DOMAIN}}
            icon: caddy.svg
            description: Reverse Proxy
            server: core-pilot
            container: caddy
            widget:
                type: caddy
                url: http://{{HOMEPAGE_VAR_HOST_LOOPBACK}}:2019
        - WireGuard:
            href: https://vpn.{{HOMEPAGE_VAR_DOMAIN}}
            icon: wireguard.svg
            description: VPN
            siteMonitor: http://{{HOMEPAGE_VAR_HOST_LOOPBACK}}:51821/
        - Linksys EA8300:
            href: https://wifi.{{HOMEPAGE_VAR_DOMAIN}}
            siteMonitor: https://{{HOMEPAGE_VAR_ROUTER_LAN_IP}}/
            icon: linksys.svg
            description: Router
       #- HP LaserJet M29w:
       #     href: https://print.{{HOMEPAGE_VAR_DOMAIN}}
       #     siteMonitor: https://{{HOMEPAGE_VAR_PRINTER_LAN_IP}}/
       #     icon: hp.svg
       #     description: Printer

    - Monitoring:
        - Uptime Kuma:
            href: https://up.{{HOMEPAGE_VAR_DOMAIN}}
            icon: uptime-kuma.svg
            description: Service Monitor
            server: core-pilot
            container: uptime-kuma
            widget:
                type: uptimekuma
                url: http://uptime-kuma:3001
                # Hostname stalls Homepage's resolver (AAAA ENODATA).
                # 169.254.1.2 does not reach a port bound only on 127.0.0.1.
                #url: http://{{HOMEPAGE_VAR_NAS_LAN_IP}}:3004
                slug: home
                fields:
                    - up
                    - down
                    - uptime
                    - incident
        - Scrutiny:
            href: https://disks.{{HOMEPAGE_VAR_DOMAIN}}
            icon: scrutiny.svg
            description: Disk Monitor
            server: core-pilot
            container: scrutiny
            widget:
                type: scrutiny
                # Same AAAA stall. 8080 is Caddy's HTTP port.
                url: http://{{HOMEPAGE_VAR_HOST_LOOPBACK}}:8087
        - Prometheus:
            href: https://metrics.{{HOMEPAGE_VAR_DOMAIN}}
            icon: prometheus.svg
            description: Metrics
            server: core-pilot
