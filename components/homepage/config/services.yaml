    - Network:
        - Pi-hole:
            href: https://dns.{{HOMEPAGE_VAR_DOMAIN}}/admin
            icon: pi-hole.svg
            description: DNS
            widget:
                type: pihole
                url: http://pihole
                version: 6
                key: "{{HOMEPAGE_VAR_PIHOLE_TOKEN}}"
                fields:
                - queries
                - blocked_percent
                - gravity
        - Caddy:
            href: https://traffic.{{HOMEPAGE_VAR_DOMAIN}}
            icon: caddy.svg
            description: Traffic Manager
            widget:
