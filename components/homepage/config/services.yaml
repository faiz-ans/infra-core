- System:

    - Monitoring:
        - Uptime Kuma:
            href: https://up.{{HOMEPAGE_VAR_DOMAIN}}
            icon: uptime-kuma.svg
            description: Service Monitor
            widget:
                type: uptimekuma
                url: http://uptime-kuma:3001
                slug: home
                fields:
                    - up
                    - down
                    - uptime
                    - incident
        - Scrutiny:
            href: https://disks.{{HOMEPAGE_VAR_DOMAIN}}
            icon: scrutiny.svg
            description: Disk Monitor
            widget:
                type: scrutiny
                url: http://scrutiny:8080
        - Peanut:
            href: https://ups.{{HOMEPAGE_VAR_DOMAIN}}
            icon: peanut.svg
            description: UPS Monitor
            widget:
                type: peanut
                # pasta host-loopback (= host.containers.internal). IP skips Node AAAA stall.
                url: http://169.254.1.2:8092
                key: ups 
        - Prometheus:
            href: https://metrics.{{HOMEPAGE_VAR_DOMAIN}}
            icon: prometheus.svg
            description: Metrics
        - Grafana:
            href: https://site.{{HOMEPAGE_VAR_DOMAIN}}
            icon: grafana.svg
            description: Site Monitor

    - Platform:
        - Cockpit:
            href: https://box.{{HOMEPAGE_VAR_DOMAIN}}
            siteMonitor: http://{{HOMEPAGE_VAR_NAS_LAN_IP}}:9090
            icon: cockpit.svg
            description: Hosts and units 
        - OpenMediaVault:
            href: https://nas.{{HOMEPAGE_VAR_DOMAIN}}
            siteMonitor: http://{{HOMEPAGE_VAR_NAS_LAN_IP}}:81
