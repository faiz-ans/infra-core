apiVersion: v1
kind: Pod
metadata:
  name: jellyfin
  labels:
    app: jellyfin
spec:
  restartPolicy: Always
  containers:
  - name: jellyfin
    image: lscr.io/linuxserver/jellyfin:latest
    imagePullPolicy: Always
    env:
    - name: TZ
      value: "${site.env.timezone}"
    - name: PUID
      value: "${host.roles.workload.uid}"
    - name: PGID
      value: "${host.roles.workload.gid}"
    - name: NVIDIA_VISIBLE_DEVICES
      value: "${host.resources.gpu.gpu0.visible}"
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: "compute,video,utility"
    ports:
    - containerPort: 8096
    volumeMounts:
    - name: config
      mountPath: /config
    - name: media
      mountPath: /data/media
    resources:
      limits:
        ${host.resources.gpu.gpu0.resource}: ${host.resources.gpu.gpu0.count}

  volumes:
  - name: config
    persistentVolumeClaim:
      claimName: jellyfin-config
  - name: media
    hostPath:
      path: ${site.data.roots.groups}/all/media
