apiVersion: v1
kind: Pod
metadata:
  name: jellyfin
  labels:
    app: jellyfin
spec:
  restartPolicy: Always
  containers:
  - name: jellyfin
    image: lscr.io/linuxserver/jellyfin:latest
    imagePullPolicy: Always
    env:
    - name: TZ
      value: "${TZ}"
    - name: PUID
      value: "${PUID}"
    - name: PGID
      value: "${PGID}"
    - name: NVIDIA_VISIBLE_DEVICES
      value: "all"
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: "compute,video,utility"
    ports:
    - containerPort: 8096
    volumeMounts:
    - name: config
      mountPath: /config
    - name: media
      mountPath: /data/media
    resources:
      limits:
        nvidia.com/gpu: 1

  volumes:
  - name: config
    persistentVolumeClaim:
      claimName: jellyfin-config
  - name: media
    hostPath:
      path: ${NFS_SHARED}/media
