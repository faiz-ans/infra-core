apiVersion: v1
kind: Pod
metadata:
  name: adventurelog
  labels:
    app: adventurelog
spec:
  restartPolicy: Always
  hostAliases:
  - ip: "${site.networking.ingress.host.ip}"
    hostnames:
      - "auth.${site.env.domain}"
  containers:
  - name: db
    image: docker.io/postgis/postgis:16-3.5
    env:
    - name: POSTGRES_DB
      value: database
    - name: POSTGRES_USER
      value: adventure
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: ${secrets.adventurelog.postgres_password}
          key: value
    volumeMounts:
    - name: pg
      mountPath: /var/lib/postgresql/data
  - name: adventurelog
    image: ghcr.io/seanmorley15/adventurelog:latest
    command: ["/bin/bash", "/oidc-ca.sh"]
    args: ["supervisord", "-c", "/aio/supervisord.conf"]
    env:
    - name: TZ
      value: "${site.env.timezone}"
    - name: SITE_URL
      value: "https://travel.${site.env.domain}"
    - name: PUBLIC_URL
      value: "https://travel.${site.env.domain}"
    - name: FRONTEND_URL
      value: "https://travel.${site.env.domain}"
    - name: ORIGIN
      value: "https://travel.${site.env.domain}"
    - name: CSRF_TRUSTED_ORIGINS
      value: "https://travel.${site.env.domain}"
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: ${secrets.adventurelog.postgres_password}
          key: value
    - name: PGHOST
      value: "127.0.0.1"
    - name: POSTGRES_DB
      value: database
    - name: POSTGRES_USER
      value: adventure
    - name: DJANGO_ADMIN_USERNAME
      value: admin
    - name: DJANGO_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: ${secrets.adventurelog.admin_password}
          key: value
    - name: DJANGO_ADMIN_EMAIL
      value: "admin@${site.env.domain}"
    - name: SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: ${secrets.adventurelog.admin_password}
          key: value
    - name: DISABLE_REGISTRATION
      value: "True"
    - name: DOMAIN
      value: "${site.env.domain}"
    - name: OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: ${secrets.authelia.oidc_client_secret}
          key: value
    - name: PYTHONPATH
      value: /tmp/oidc-hooks
    ports:
    - containerPort: 80
    volumeMounts:
    - name: media
      mountPath: /code/media
    - name: wrap
      mountPath: /oidc-ca.sh
      readOnly: true
    - name: site
      mountPath: /oidc-sitecustomize.py
      readOnly: true
    - name: seed
      mountPath: /oidc-seed.py
      readOnly: true
  volumes:
  - name: pg
    hostPath:
      path: "${host.data.roots.appdata}/adventurelog/postgres"
  - name: media
    hostPath:
      path: "${host.data.roots.appdata}/adventurelog/media"
  - name: wrap
    hostPath:
      path: "${component.dir}/entrypoint-oidc.sh"
  - name: site
    hostPath:
      path: "${component.dir}/sitecustomize-oidc.py"
  - name: seed
    hostPath:
      path: "${component.dir}/seed-oidc.py"
