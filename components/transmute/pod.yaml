apiVersion: v1
kind: Pod
metadata:
  name: transmute
  labels:
    app: transmute
spec:
  restartPolicy: Always
  hostAliases:
  - ip: "${NAS_LAN_IP}"
    hostnames:
      - "auth.${DOMAIN}"
  containers:
  - name: transmute
    image: ghcr.io/transmute-app/transmute:latest
    command: ["/bin/bash", "/oidc-ca.sh"]
    env:
    - name: TZ
      value: "${TZ}"
    - name: AUTH_SECRET_KEY
      value: "${TRANSMUTE_AUTH_SECRET_KEY}"
    - name: APP_URL
      value: "https://convert.${DOMAIN}"
    - name: PORT
      value: "3313"
    - name: OIDC_ISSUER_URL
      value: "https://auth.${DOMAIN}"
    - name: OIDC_CLIENT_ID
      value: transmute
    - name: OIDC_CLIENT_SECRET
      value: "${OIDC_CLIENT_SECRET}"
    - name: NVIDIA_VISIBLE_DEVICES
      value: all
    ports:
    - containerPort: 3313
    resources:
      limits:
        nvidia.com/gpu: 1
    volumeMounts:
    - name: data
      mountPath: /app/data
    - name: wrap
      mountPath: /oidc-ca.sh
      readOnly: true
    - name: site
      mountPath: /oidc-sitecustomize.py
      readOnly: true
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: transmute-data
  - name: wrap
    hostPath:
      path: "${COMPONENT_DIR}/entrypoint-oidc.sh"
  - name: site
    hostPath:
      path: "${COMPONENT_DIR}/sitecustomize-oidc.py"
