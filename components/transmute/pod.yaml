apiVersion: v1
kind: Pod
metadata:
  name: transmute
  labels:
    app: transmute
spec:
  restartPolicy: Always
  hostAliases:
  - ip: "${site.networking.ingress.host.ip}"
    hostnames:
      - "auth.${site.env.domain}"
  containers:
  - name: transmute
    image: ghcr.io/transmute-app/transmute:latest
    command: ["/bin/bash", "/oidc-ca.sh"]
    env:
    - name: TZ
      value: "${site.env.timezone}"
    - name: AUTH_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: ${secrets.transmute.auth_secret}
    - name: APP_URL
      value: "https://convert.${site.env.domain}"
    - name: PORT
      value: "3313"
    - name: OIDC_ISSUER_URL
      value: "https://auth.${site.env.domain}"
    - name: OIDC_CLIENT_ID
      value: transmute
    - name: OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: ${secrets.authelia.oidc_client_secret}
    - name: NVIDIA_VISIBLE_DEVICES
      value: "${host.resources.gpu.gpu0.uuid}"
    ports:
    - containerPort: 3313
    resources:
      limits:
        ${host.resources.gpu.gpu0.resource}: 1
    volumeMounts:
    - name: data
      mountPath: /app/data
    - name: wrap
      mountPath: /oidc-ca.sh
      readOnly: true
    - name: site
      mountPath: /oidc-sitecustomize.py
      readOnly: true
  volumes:
  - name: data
    hostPath:
      path: "${host.data.roots.appdata}/transmute"
  - name: wrap
    hostPath:
      path: "${component.dir}/entrypoint-oidc.sh"
  - name: site
    hostPath:
      path: "${component.dir}/sitecustomize-oidc.py"
