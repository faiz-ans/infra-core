apiVersion: v1
kind: Pod
metadata:
  name: scriberr
  labels:
    app: scriberr
spec:
  restartPolicy: Always
  containers:
  - name: scriberr
    image: ghcr.io/rishikanthc/scriberr-cuda:latest
    imagePullPolicy: Always
    env:
    - name: TZ
      value: "${TZ}"
    - name: PUID
      value: "10001"
    - name: PGID
      value: "10001"
    - name: APP_ENV
      value: "production"
    - name: ALLOWED_ORIGINS
      value: "https://voice.${DOMAIN},https://scribe.${DOMAIN},https://transcribe.${DOMAIN},https://scriberr.${DOMAIN}"
    - name: NVIDIA_VISIBLE_DEVICES
      value: "all"
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: "compute,utility"
    ports:
    - containerPort: 8080
    volumeMounts:
    - name: data
      mountPath: /app/data
    - name: whisper
      mountPath: /app/whisperx-env
    resources:
      limits:
        nvidia.com/gpu: 1

  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: scriberr-data
  - name: whisper
    persistentVolumeClaim:
      claimName: scriberr-whisperx
