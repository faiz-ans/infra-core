# Official service pack. Comment-only engines in example YAML are not listed.
# network: site | host
# privilege: rootless | rootful
# sso: oidc | forward-auth | none | admin-only
# dirs: extra dirs under groups/all created only when this service is desired
# Lessons: keep-id on Caddy/Authelia/OpenCloud/PeaNUT; lan-bind OUTPUT :443 not :53;
# OpenCloud OIDC verify=none + 169.254.1.2 auth.; Homepage :8443 + loopback scrapes;
# Pi-hole widget key = web password; PeaNUT host-net :8092 / NUT localhost / no AUTH_URL;
# WG MTU 1280; no OpenCloud space recreate if xattrs exist.

services:
  caddy:
    component: caddy
    network: host
    privilege: rootless
    sso: none
    ports: { http: 8080, https: 8443 }
    keep_id: true
  authelia:
    component: authelia
    network: site
    privilege: rootless
    sso: none
    ports: { web: 9091 }
    keep_id: true
    publish: ["127.0.0.1:9091:9091"]
  openldap:
    component: openldap
    network: site
    privilege: rootless
    sso: none
    publish: ["127.0.0.1:389:389"]
  opencloud:
    component: opencloud
    network: site
    privilege: rootless
    sso: oidc
    ports: { web: 9200 }
    keep_id: true
    publish: ["127.0.0.1:9200:9200"]
  radicale:
    component: radicale
    network: site
    privilege: rootless
    sso: none
  pi-hole:
    component: pi-hole
    network: host
    privilege: rootless
    sso: none
    ports: { dns: 15353, web: 8088 }
  pi-hole-mantle:
    component: pihole-mantle
    network: host
    privilege: rootless
    sso: none
  glances:
    component: glances
    network: site
    privilege: rootless
    sso: forward-auth
    ports: { web: 61208 }
  homepage:
    component: homepage
    network: site
    privilege: rootless
    sso: none
    ports: { web: 3000 }
    publish: ["127.0.0.1:3000:3000"]
  peanut:
    component: peanut
    network: host
    privilege: rootless
    sso: forward-auth
    ports: { web: 8092 }
    keep_id: true
  vaultwarden:
    component: vaultwarden
    network: site
    privilege: rootless
    sso: admin-only
    ports: { web: 8082 }
  jotty:
    component: jotty
    network: site
    privilege: rootless
    sso: oidc
    ports: { web: 3002 }
  linkding:
    component: linkding
    network: site
    privilege: rootless
    sso: oidc
    ports: { web: 9093 }
  bytestash:
    component: bytestash
    network: site
    privilege: rootless
    sso: oidc
    ports: { web: 5000 }
  bentopdf:
    component: bentopdf
    network: site
    privilege: rootless
    sso: forward-auth
    ports: { web: 8084 }
  it-tools:
    component: it-tools
    network: site
    privilege: rootless
    sso: forward-auth
    ports: { web: 8087 }
  libretranslate:
    component: libretranslate
    network: site
    privilege: rootless
    sso: forward-auth
    ports: { web: 5000 }
  immich:
    component: immich
    network: site
    privilege: rootless
    sso: oidc
    ports: { web: 2283 }
  adventurelog:
    component: adventurelog
    network: site
    privilege: rootless
    sso: oidc
    ports: { web: 8015 }
  transmute:
    component: transmute
    network: site
    privilege: rootless
    sso: oidc
    ports: { web: 3313 }
  jellyfin:
    component: jellyfin
