apiVersion: v1
kind: Pod
metadata:
  name: jotty
  labels:
    app: jotty
spec:
  hostAliases:
  - ip: "${NAS_LAN_IP}"
    hostnames:
      - "auth.${DOMAIN}"

  restartPolicy: Always
  containers:
  - name: jotty
    image: ghcr.io/fccview/jotty:latest
    imagePullPolicy: Always
    env:
    - name: TZ
      value: "${TZ}"
    - name: PUID
      value: "${PUID}"
    - name: PGID
      value: "${PGID}"
    - name: NODE_ENV
      value: "production"
    - name: APP_URL
      value: "https://notes.${DOMAIN}"
    - name: HTTPS
      value: "true"
    - name: AUTH_MODE
      value: "oidc"
    - name: OIDC_ISSUER
      value: "https://auth.${DOMAIN}"
    - name: OIDC_CLIENT_ID
      value: "jotty"
    - name: OIDC_CLIENT_SECRET
      value: "${OIDC_CLIENT_SECRET}"
    - name: SSO_FALLBACK_LOCAL
      value: "yes"
    - name: OIDC_ADMIN_GROUPS
      value: "admins"
    - name: OIDC_USER_GROUPS
      value: "users"
    - name: OIDC_GROUPS_SCOPE
      value: "groups"
    - name: INTERNAL_API_URL
      value: "http://localhost:3000"
    - name: NODE_TLS_REJECT_UNAUTHORIZED
      value: "0"
    ports:
    - containerPort: 3000
    volumeMounts:
    - name: data
      mountPath: /app/data
    - name: config
      mountPath: /app/config
    - name: cache
      mountPath: /app/.next/cache

  volumes:
  - name: data
    hostPath:
      path: ${DATA_ROOT}/system/jotty/data
  - name: config
    hostPath:
      path: ${DATA_ROOT}/system/jotty/config
  - name: cache
    hostPath:
      path: ${DATA_ROOT}/system/jotty/cache
