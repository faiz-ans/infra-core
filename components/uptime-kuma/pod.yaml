apiVersion: v1
kind: Pod
metadata:
  name: uptime-kuma
  labels:
    app: uptime-kuma
spec:
  restartPolicy: Always
  containers:
  - name: uptime-kuma
    image: docker.io/louislam/uptime-kuma:1
    imagePullPolicy: Always
    env:
    - name: TZ
      value: "${site.env.timezone}"
    ports:
    - containerPort: 3001
    volumeMounts:
    - name: data
      mountPath: /app/data

  volumes:
  - name: data
    hostPath:
      path: ${site.data.roots.appdata}/system/uptime-kuma
