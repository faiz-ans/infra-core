apiVersion: v1
kind: Pod
metadata:
  name: frigate
  labels:
    app: frigate
spec:
  restartPolicy: Always
  containers:
  - name: mosquitto
    image: docker.io/eclipse-mosquitto:2
    ports:
    - containerPort: 1883
    volumeMounts:
    - name: mosq
      mountPath: /mosquitto/config
      readOnly: true
  - name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    command: ["/bin/sh", "-c", "if [ ! -f /config/config.yml ] && [ ! -f /config/config.yaml ]; then cp /seed/config.yml /config/config.yml; fi; exec /init"]
    env:
    - name: TZ
      value: "${TZ}"
    ports:
    - containerPort: 8971
    - containerPort: 8554
    - containerPort: 8555
    volumeMounts:
    - name: config
      mountPath: /config
    - name: media
      mountPath: /media/frigate
    - name: seed
      mountPath: /seed
      readOnly: true
    - name: cache
      mountPath: /tmp/cache
  volumes:
  - name: mosq
    hostPath:
      path: "${COMPONENT_DIR}/mosquitto"
  - name: config
    persistentVolumeClaim:
      claimName: frigate-config
  - name: media
    hostPath:
      path: "${NFS_SHARED}/cameras"
  - name: seed
    hostPath:
      path: "${COMPONENT_DIR}/seed"
  - name: cache
    emptyDir: {}
