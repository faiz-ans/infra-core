apiVersion: v1
kind: Pod
metadata:
  name: arr
  labels:
    app: arr
spec:
  restartPolicy: Always
  containers:
  - name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    env:
    - name: TZ
      value: "${site.env.timezone}"
    - name: PUID
      value: "${host.operations.workload.uid}"
    - name: PGID
      value: "${host.operations.workload.gid}"
    ports:
    - containerPort: 8989
    volumeMounts:
    - name: sonarr
      mountPath: /config
    - name: media
      mountPath: /data/media
    - name: downloads
      mountPath: /downloads
  - name: radarr
    image: lscr.io/linuxserver/radarr:latest
    env:
    - name: TZ
      value: "${site.env.timezone}"
    - name: PUID
      value: "${host.operations.workload.uid}"
    - name: PGID
      value: "${host.operations.workload.gid}"
    ports:
    - containerPort: 7878
    volumeMounts:
    - name: radarr
      mountPath: /config
    - name: media
      mountPath: /data/media
    - name: downloads
      mountPath: /downloads
  - name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    env:
    - name: TZ
      value: "${site.env.timezone}"
    - name: PUID
      value: "${host.operations.workload.uid}"
    - name: PGID
      value: "${host.operations.workload.gid}"
    ports:
    - containerPort: 9696
    volumeMounts:
    - name: prowlarr
      mountPath: /config
  - name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    env:
    - name: TZ
      value: "${site.env.timezone}"
    - name: LOG_LEVEL
      value: info
  volumes:
  - name: sonarr
    hostPath:
      path: "${host.data.roots.appdata}/arr/sonarr"
  - name: radarr
    hostPath:
      path: "${host.data.roots.appdata}/arr/radarr"
  - name: prowlarr
    hostPath:
      path: "${host.data.roots.appdata}/arr/prowlarr"
  - name: media
    hostPath:
      path: "${site.data.roots.groups}/all/media"
  - name: downloads
    hostPath:
      path: "${site.data.roots.groups}/all/downloads"
