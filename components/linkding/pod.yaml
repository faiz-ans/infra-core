apiVersion: v1
kind: Pod
metadata:
  name: linkding
  labels:
    app: linkding
spec:
  hostAliases:
  - ip: "${site.networking.loopback}"
    hostnames:
      - "auth.${site.env.domain}"

  restartPolicy: Always
  containers:
  - name: linkding
    image: docker.io/sissbruecker/linkding:latest
    imagePullPolicy: Always
    env:
    - name: TZ
      value: "${site.env.timezone}"
    - name: LD_SUPERUSER_NAME
      value: "${site.env.linkding_superuser}"
    - name: LD_SUPERUSER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: ${secrets.linkding.superuser_password}
    - name: LD_CSRF_TRUSTED_ORIGINS
      value: "https://links.${site.env.domain},https://bookmarks.${site.env.domain},https://linkding.${site.env.domain},https://auth.${site.env.domain}"
    - name: LD_ENABLE_OIDC
      value: "True"
    - name: OIDC_RP_CLIENT_ID
      value: "linkding"
    - name: OIDC_RP_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: ${secrets.authelia.oidc_client_secret}
    - name: OIDC_OP_AUTHORIZATION_ENDPOINT
      value: "https://auth.${site.env.domain}/api/oidc/authorization"
    - name: OIDC_OP_TOKEN_ENDPOINT
      value: "https://auth.${site.env.domain}/api/oidc/token"
    - name: OIDC_OP_USER_ENDPOINT
      value: "https://auth.${site.env.domain}/api/oidc/userinfo"
    - name: OIDC_OP_JWKS_ENDPOINT
      value: "https://auth.${site.env.domain}/jwks.json"
    - name: OIDC_VERIFY_SSL
      value: "False"
    ports:
    - containerPort: 9090
    volumeMounts:
    - name: data
      mountPath: /etc/linkding/data

  volumes:
  - name: data
    hostPath:
      path: ${site.data.roots.appdata}/system/linkding
