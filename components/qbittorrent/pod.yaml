apiVersion: v1
kind: Pod
metadata:
  name: qbittorrent
  labels:
    app: qbittorrent
spec:
  restartPolicy: Always
  containers:
  - name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    imagePullPolicy: Always
    env:
    - name: TZ
      value: "${site.env.timezone}"
    - name: PUID
      value: "${host.roles.workload.uid}"
    - name: PGID
      value: "${host.roles.workload.gid}"
    - name: WEBUI_PORT
      value: "8081"
    - name: TORRENTING_PORT
      value: "6881"
    ports:
    - containerPort: 8081
    - containerPort: 6881
    volumeMounts:
    - name: config
      mountPath: /config
    - name: downloads
      mountPath: /downloads
    - name: media
      mountPath: /data/media
    - name: init
      mountPath: /custom-cont-init.d
      readOnly: true

  volumes:
  - name: config
    hostPath:
      path: ${host.data.roots.appdata}/qbittorrent
  - name: downloads
    hostPath:
      path: ${site.data.roots.groups}/all/downloads
  - name: media
    hostPath:
      path: ${site.data.roots.groups}/all/media
  - name: init
    hostPath:
      path: ${component.dir}/custom-cont-init.d
