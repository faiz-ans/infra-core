# OpenCloud proxy overlay. Authelia group → role map.
# CalDAV and CardDAV routes are appended only while radicale is placed.
# Role mapping: Authelia claim "groups". First matching mapping wins.
role_assignment:
  driver: oidc
  oidc_role_mapper:
    role_claim: groups
    role_mapping:
      - role_name: admin
        claim_value: admins
      - role_name: user
        claim_value: users
