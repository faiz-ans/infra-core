apiVersion: v1
kind: Pod
metadata:
  name: opencloud
  labels:
    app: opencloud
spec:
  restartPolicy: Always
  hostAliases:
  - ip: "${site.networking.ingress.host.ip}"
    hostnames:
      - "cloud.${site.env.domain}"
      - "office.${site.env.domain}"
  # Pasta host-loopback. site → NAS_LAN_IP:443 is refused; lan-bind OUTPUT
  # maps 127.0.0.1:443 → Caddy :8443. Off-host OIDC still uses NAS_LAN_IP.
  - ip: "${site.networking.loopback}"
    hostnames:
      - "auth.${site.env.domain}"
  containers:
  - name: radicale
    image: docker.io/opencloudeu/radicale:latest
    volumeMounts:
    - name: radconf
      mountPath: /etc/radicale/config
      readOnly: true
    - name: raddata
      mountPath: /var/lib/radicale
  - name: opencloud
    image: docker.io/opencloudeu/opencloud-rolling:latest
    command: ["/bin/sh", "-c", "opencloud init || true; opencloud server"]
    env:
    - name: TZ
      value: "${site.env.timezone}"
    - name: PUID
      value: "${host.roles.workload.uid}"
    - name: PGID
      value: "${host.roles.workload.gid}"
    - name: PROXY_HTTP_ADDR
      value: "0.0.0.0:9200"
    - name: PROXY_TLS
      value: "false"
    - name: OC_INSECURE
      value: "true"
    - name: IDM_CREATE_DEMO_USERS
      value: "false"
    - name: IDM_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: ${secrets.opencloud.admin_password}
    - name: OC_URL
      value: "https://cloud.${site.env.domain}"
    - name: OC_DOMAIN
      value: "cloud.${site.env.domain}"
    - name: IDP_DOMAIN
      value: "auth.${site.env.domain}"
    - name: OC_OIDC_ISSUER
      value: "https://auth.${site.env.domain}"
    - name: WEB_OIDC_CLIENT_ID
      value: opencloud
    - name: WEB_OIDC_SCOPE
      value: "openid groups profile email"
    # Authelia access tokens are opaque. JWT verify → "Not logged in / safety log out".
    # Official: opencloud-compose idm/external-authelia.yml
    - name: PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD
      value: "none"
    - name: PROXY_OIDC_SKIP_VERIFICATION
      value: "false"
    - name: PROXY_USER_OIDC_CLAIM
      value: preferred_username
    - name: PROXY_AUTOPROVISION_ACCOUNTS
      value: "true"
    - name: PROXY_AUTOPROVISION_CLAIM_USERNAME
      value: preferred_username
    - name: PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM
      value: groups
    - name: GRAPH_ASSIGN_DEFAULT_USER_ROLE
      value: "true"
    - name: OC_EXCLUDE_RUN_SERVICES
      value: idp
    - name: COLLABORA_DOMAIN
      value: "office.${site.env.domain}"
    - name: COLLABORATION_APP_ADDR
      value: "https://office.${site.env.domain}"
    - name: COLLABORATION_WOPI_SRC
      value: "https://cloud.${site.env.domain}"
    - name: COLLABORATION_APP_PROOF_DISABLE
      value: "true"
    - name: PROXY_CSP_CONFIG_FILE_LOCATION
      value: /etc/opencloud/csp.yaml
    - name: PROXY_ENABLE_BASIC_AUTH
      value: "true"
    - name: OC_ADD_RUN_SERVICES
      value: collaboration
    - name: STORAGE_USERS_DRIVER
      value: posix
    - name: STORAGE_USERS_POSIX_ROOT
      value: /posix
    - name: STORAGE_USERS_POSIX_WATCH_FS
      value: "true"
    - name: STORAGE_USERS_POSIX_PERSONAL_SPACE_PATH_TEMPLATE
      value: "users/{{.User.Username}}/files"
    - name: STORAGE_USERS_POSIX_GENERAL_SPACE_PATH_TEMPLATE
      value: "projects/{{.SpaceName}}"
    ports:
    - containerPort: 9200
    volumeMounts:
    - name: occonfig
      mountPath: /etc/opencloud
    - name: csp
      mountPath: /etc/opencloud/csp.yaml
      readOnly: true
    - name: proxy
      mountPath: /etc/opencloud/proxy.yaml
    - name: ocdata
      mountPath: /var/lib/opencloud
    - name: posix
      mountPath: /posix
    - name: users
      mountPath: /posix/users
    - name: projects
      mountPath: /posix/projects
  volumes:
  - name: radconf
    hostPath:
      path: "${component.dir}/radicale-config"
  - name: raddata
    hostPath:
      path: "${site.data.roots.appdata}/opencloud/radicale"
  - name: occonfig
    hostPath:
      path: "${site.data.roots.appdata}/opencloud/config"
  - name: csp
    hostPath:
      path: "${component.dir}/csp.yaml"
  - name: proxy
    hostPath:
      path: "${component.dir}/proxy.yaml"
  - name: ocdata
    hostPath:
      path: "${site.data.roots.appdata}/opencloud/data"
  - name: posix
    hostPath:
      path: "${site.data.roots.appdata}/opencloud/posix"
  - name: users
    hostPath:
      path: "${site.data.roots.users}"
  - name: projects
    hostPath:
      path: "${site.data.roots.appdata}/opencloud/projects"
