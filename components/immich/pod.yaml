apiVersion: v1
kind: Pod
metadata:
  name: immich
  labels:
    app: immich
spec:
  restartPolicy: Always
  hostAliases:
  - ip: "${site.networking.ingress.host.ip}"
    hostnames:
      - "auth.${site.env.domain}"
  containers:
  - name: database
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    env:
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: ${secrets.immich.database_password}
    - name: POSTGRES_USER
      value: immich
    - name: POSTGRES_DB
      value: immich
    volumeMounts:
    - name: pg
      mountPath: /var/lib/postgresql/data
  - name: redis
    image: docker.io/valkey/valkey:9
  - name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:release-cuda
    env:
    - name: TZ
      value: "${site.env.timezone}"
    - name: NVIDIA_VISIBLE_DEVICES
      value: "${host.resources.gpu.gpu0.visible}"
    resources:
      limits:
        ${host.resources.gpu.gpu0.resource}: ${host.resources.gpu.gpu0.count}
    volumeMounts:
    - name: ml
      mountPath: /cache
  - name: immich-server
    image: ghcr.io/immich-app/immich-server:release
    env:
    - name: TZ
      value: "${site.env.timezone}"
    - name: DB_HOSTNAME
      value: "127.0.0.1"
    - name: DB_USERNAME
      value: immich
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: ${secrets.immich.database_password}
    - name: DB_DATABASE_NAME
      value: immich
    - name: REDIS_HOSTNAME
      value: "127.0.0.1"
    - name: NODE_TLS_REJECT_UNAUTHORIZED
      value: "0"
    ports:
    - containerPort: 2283
    volumeMounts:
    - name: upload
      mountPath: /data
    - name: photos
      mountPath: /mnt/photos
    - name: users
      mountPath: /mnt/users
  volumes:
  - name: pg
    persistentVolumeClaim:
      claimName: immich-postgres
  - name: ml
    persistentVolumeClaim:
      claimName: immich-ml-cache
  - name: upload
    persistentVolumeClaim:
      claimName: immich-upload
  - name: photos
    hostPath:
      path: "${site.data.roots.groups}/all/photos"
  - name: users
    hostPath:
      path: "${site.data.roots.users}"
